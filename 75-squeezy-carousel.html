<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squeezy Carousel</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --text: #f5f5f5;
    --accent: #6366f1;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ─── Header ─── */
  .header {
    padding: 3rem 2rem 2rem;
    text-align: center;
  }

  .header h1 {
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 900;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, #fff 0%, #6366f1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header p {
    color: #555;
    font-size: 0.9rem;
    margin-top: 0.5rem;
  }

  /* ─── Carousel Container ─── */
  .carousel-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    position: relative;
  }

  .carousel {
    position: relative;
    width: 100%;
    max-width: 900px;
    height: 480px;
    perspective: 1200px;
  }

  .carousel-card {
    position: absolute;
    width: 320px;
    height: 440px;
    top: 50%;
    left: 50%;
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    transform-origin: center center;
    transition:
      transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
      opacity 0.6s ease,
      filter 0.6s ease;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .carousel-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }

  .carousel-card:hover img {
    transform: scale(1.05);
  }

  .carousel-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
  }

  .carousel-card .info {
    position: absolute;
    bottom: 1.5rem;
    left: 1.5rem;
    z-index: 2;
  }

  .carousel-card .info h3 {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
  }

  .carousel-card .info span {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* ─── Navigation Dots ─── */
  .nav-dots {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    padding: 2rem;
  }

  .nav-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #333;
    border: none;
    cursor: pointer;
    transition: all 0.3s;
  }

  .nav-dot.active {
    background: var(--accent);
    transform: scale(1.4);
  }

  /* ─── Arrow Buttons ─── */
  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #999;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    z-index: 50;
  }

  .nav-arrow:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border-color: rgba(255,255,255,0.2);
  }

  .nav-arrow.prev { left: 0; }
  .nav-arrow.next { right: 0; }

  /* ─── Second carousel: Squish Stack ─── */
  .section-2 {
    padding: 4rem 2rem;
  }

  .section-2-header {
    text-align: center;
    margin-bottom: 3rem;
  }

  .section-2-header h2 {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .section-2-header p {
    color: #555;
    font-size: 0.85rem;
    margin-top: 0.5rem;
  }

  .stack-carousel {
    position: relative;
    max-width: 600px;
    margin: 0 auto;
    height: 400px;
    perspective: 800px;
  }

  .stack-card {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 20px;
    overflow: hidden;
    transition:
      transform 0.7s cubic-bezier(0.16, 1, 0.3, 1),
      opacity 0.5s ease;
    cursor: pointer;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
  }

  .stack-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .stack-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
  }

  .stack-card .stack-info {
    position: absolute;
    bottom: 2rem;
    left: 2rem;
    z-index: 2;
    font-size: 1.2rem;
    font-weight: 700;
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 3rem;
    font-size: 0.7rem;
    color: #222;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  @media (max-width: 768px) {
    .carousel-card { width: 240px; height: 340px; }
    .carousel { height: 380px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Squeezy Carousel</h1>
  <p>Elastic card transitions with squeeze and spring physics</p>
</div>

<!-- Main Squeezy Carousel -->
<div class="carousel-wrap">
  <div class="carousel" id="carousel">
    <button class="nav-arrow prev" onclick="navigate(-1)">‹</button>
    <button class="nav-arrow next" onclick="navigate(1)">›</button>
  </div>
</div>

<div class="nav-dots" id="navDots"></div>

<!-- Second: Stack dismiss -->
<section class="section-2">
  <div class="section-2-header">
    <h2>Squish Stack</h2>
    <p>Click to dismiss with squish animation</p>
  </div>
  <div class="stack-carousel" id="stackCarousel"></div>
</section>

<footer>075 — Squeezy Carousel</footer>

<script>
// ─── Carousel 1: Elastic Spread ───
const carousel = document.getElementById('carousel');
const dotsContainer = document.getElementById('navDots');
const CARD_COUNT = 5;
let current = 0;

const cards = [];
const cardData = [
  { title: 'Flow State', sub: 'Creative Process' },
  { title: 'Deep Work', sub: 'Focus & Clarity' },
  { title: 'Iteration', sub: 'Refine & Polish' },
  { title: 'Shipping', sub: 'Launch & Learn' },
  { title: 'Rest', sub: 'Recharge & Reflect' },
];

for (let i = 0; i < CARD_COUNT; i++) {
  const card = document.createElement('div');
  card.className = 'carousel-card';
  card.innerHTML = `
    <img src="https://picsum.photos/seed/${i + 200}/640/880" alt="" loading="lazy">
    <div class="info">
      <h3>${cardData[i].title}</h3>
      <span>${cardData[i].sub}</span>
    </div>
  `;
  card.addEventListener('click', () => {
    if (i !== current) goTo(i);
  });
  carousel.appendChild(card);
  cards.push(card);

  // Dots
  const dot = document.createElement('button');
  dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
  dot.addEventListener('click', () => goTo(i));
  dotsContainer.appendChild(dot);
}

function updatePositions() {
  const dots = dotsContainer.querySelectorAll('.nav-dot');
  
  cards.forEach((card, i) => {
    const offset = i - current;
    const absOffset = Math.abs(offset);
    
    // Squeezy positioning: closer cards are larger, farther are squeezed
    const translateX = offset * 200;
    const translateZ = -absOffset * 100;
    const rotateY = offset * -5;
    const scale = 1 - absOffset * 0.1;
    const opacity = absOffset > 2 ? 0 : 1 - absOffset * 0.2;
    
    // Squeeze effect: cards being pushed aside get compressed horizontally
    const scaleX = absOffset === 0 ? 1 : 1 - absOffset * 0.05;
    const scaleY = absOffset === 0 ? 1 : 1 + absOffset * 0.02; // Slightly stretch vertically
    
    card.style.transform = `
      translate(-50%, -50%)
      translateX(${translateX}px)
      translateZ(${translateZ}px)
      rotateY(${rotateY}deg)
      scale(${scale})
      scaleX(${scaleX})
      scaleY(${scaleY})
    `;
    card.style.opacity = opacity;
    card.style.zIndex = CARD_COUNT - absOffset;
    card.style.filter = absOffset > 0 ? `brightness(${1 - absOffset * 0.15})` : 'none';
    
    // Update dots
    dots[i].classList.toggle('active', i === current);
  });
}

function goTo(index) {
  current = Math.max(0, Math.min(CARD_COUNT - 1, index));
  updatePositions();
}

function navigate(dir) {
  goTo(current + dir);
}

updatePositions();

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
});

// Touch/swipe support
let touchStartX = 0;
carousel.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });
carousel.addEventListener('touchend', e => {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) navigate(diff > 0 ? 1 : -1);
}, { passive: true });

// ─── Carousel 2: Stack Dismiss ───
const stackContainer = document.getElementById('stackCarousel');
const stackCount = 4;
const stackCards = [];

const stackData = [
  'Momentum', 'Clarity', 'Purpose', 'Vision'
];

for (let i = 0; i < stackCount; i++) {
  const card = document.createElement('div');
  card.className = 'stack-card';
  card.innerHTML = `
    <img src="https://picsum.photos/seed/${i + 300}/1200/800" alt="" loading="lazy">
    <span class="stack-info">${stackData[i]}</span>
  `;
  stackContainer.appendChild(card);
  stackCards.push(card);
}

let stackTop = stackCount - 1;

function updateStack() {
  stackCards.forEach((card, i) => {
    const offset = stackTop - i;
    if (offset < 0) {
      card.style.transform = 'translateX(120%) rotate(15deg)';
      card.style.opacity = '0';
    } else {
      card.style.transform = `
        translateY(${offset * 8}px)
        scale(${1 - offset * 0.04})
      `;
      card.style.opacity = offset > 3 ? '0' : '1';
      card.style.zIndex = stackCount - offset;
    }
  });
}

updateStack();

stackCards.forEach((card, i) => {
  card.addEventListener('click', () => {
    if (i === stackTop) {
      // Squish and dismiss top card
      card.style.transform = 'translateX(120%) scaleX(0.7) scaleY(1.1) rotate(10deg)';
      card.style.opacity = '0';
      stackTop--;
      
      if (stackTop < 0) {
        // Reset
        setTimeout(() => {
          stackTop = stackCount - 1;
          updateStack();
        }, 700);
      } else {
        setTimeout(updateStack, 100);
      }
    }
  });
});
</script>
</body>
</html>
