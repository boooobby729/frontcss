<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Letter Entrance — Cinematic Text Animations</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050505;
    --text: #ffffff;
    --accent: #6366f1;
    --accent2: #ec4899;
    --accent3: #10b981;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── Section Layout ─── */
  .section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
    position: relative;
    overflow: hidden;
  }

  .section::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 50%, var(--glow, rgba(99,102,241,0.08)) 0%, transparent 70%);
    pointer-events: none;
  }

  .section-label {
    position: absolute;
    top: 2rem;
    left: 2rem;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #444;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .section-label::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  .replay-btn {
    position: absolute;
    top: 2rem;
    right: 2rem;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #666;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.5rem 1rem;
    border-radius: 2rem;
    cursor: pointer;
    transition: all 0.3s;
  }

  .replay-btn:hover {
    background: rgba(255,255,255,0.1);
    color: #aaa;
    border-color: rgba(255,255,255,0.2);
  }

  /* ═══════════════════════════════════════
     VARIANT 1 — Split Letter Rise
     ═══════════════════════════════════════ */
  .hero-text-1 {
    font-size: clamp(4rem, 12vw, 10rem);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.04em;
    text-align: center;
  }

  .hero-text-1 .line {
    display: block;
    overflow: hidden;
    padding: 0.05em 0;
  }

  .hero-text-1 .char {
    display: inline-block;
    transform: translateY(120%);
    opacity: 0;
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.6s ease;
    transition-delay: var(--d);
  }

  .hero-text-1 .char.visible {
    transform: translateY(0);
    opacity: 1;
  }

  .hero-text-1 .line:nth-child(2) .char {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ═══════════════════════════════════════
     VARIANT 2 — Elastic Scale Pop
     ═══════════════════════════════════════ */
  .hero-text-2 {
    font-size: clamp(3.5rem, 10vw, 8rem);
    font-weight: 800;
    text-align: center;
    line-height: 1.1;
  }

  .hero-text-2 .word {
    display: inline-block;
    margin: 0 0.15em;
    transform: scale(0) rotate(-10deg);
    opacity: 0;
    transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.5s ease;
    transition-delay: var(--d);
  }

  .hero-text-2 .word.visible {
    transform: scale(1) rotate(0deg);
    opacity: 1;
  }

  .hero-text-2 .highlight {
    color: var(--accent3);
    position: relative;
  }

  .hero-text-2 .highlight::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 100%;
    height: 4px;
    background: var(--accent3);
    border-radius: 2px;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1s;
  }

  .hero-text-2 .highlight.visible::after {
    transform: scaleX(1);
  }

  /* ═══════════════════════════════════════
     VARIANT 3 — Typewriter Decode
     ═══════════════════════════════════════ */
  .hero-text-3 {
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 700;
    font-family: 'JetBrains Mono', 'SF Mono', monospace;
    text-align: center;
    line-height: 1.4;
  }

  .hero-text-3 .char {
    display: inline-block;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.1s, transform 0.3s ease, color 0.2s;
  }

  .hero-text-3 .char.decoding {
    opacity: 1;
    transform: translateY(0);
    color: var(--accent);
  }

  .hero-text-3 .char.decoded {
    opacity: 1;
    transform: translateY(0);
    color: var(--text);
  }

  .hero-text-3 .cursor-blink {
    display: inline-block;
    width: 3px;
    height: 1em;
    background: var(--accent);
    vertical-align: middle;
    margin-left: 2px;
    animation: cursorBlink 1s step-end infinite;
  }

  @keyframes cursorBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* ═══════════════════════════════════════
     VARIANT 4 — 3D Perspective Flip
     ═══════════════════════════════════════ */
  .hero-text-4 {
    font-size: clamp(3rem, 9vw, 7rem);
    font-weight: 900;
    text-align: center;
    line-height: 1;
    perspective: 1000px;
  }

  .hero-text-4 .line {
    display: block;
    margin-bottom: 0.1em;
  }

  .hero-text-4 .char {
    display: inline-block;
    transform-origin: 50% 100%;
    transform: rotateX(-90deg);
    opacity: 0;
    transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.5s ease;
    transition-delay: var(--d);
  }

  .hero-text-4 .char.visible {
    transform: rotateX(0deg);
    opacity: 1;
  }

  .hero-text-4 .line:nth-child(2) {
    background: linear-gradient(90deg, var(--accent2), #f97316, #eab308);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ─── Subtle bg pattern ─── */
  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  .section { position: relative; z-index: 1; }
</style>
</head>
<body>

<div class="bg-grid"></div>

<!-- ═══ Variant 1: Split Letter Rise ═══ -->
<section class="section" id="s1" style="--glow: rgba(99,102,241,0.08)">
  <span class="section-label">01 — Split Rise</span>
  <button class="replay-btn" onclick="playV1()">Replay</button>
  <div class="hero-text-1" id="hero1">
    <span class="line" id="line1a"></span>
    <span class="line" id="line1b"></span>
  </div>
</section>

<!-- ═══ Variant 2: Elastic Scale Pop ═══ -->
<section class="section" id="s2" style="--glow: rgba(16,185,129,0.08)">
  <span class="section-label">02 — Elastic Pop</span>
  <button class="replay-btn" onclick="playV2()">Replay</button>
  <div class="hero-text-2" id="hero2"></div>
</section>

<!-- ═══ Variant 3: Typewriter Decode ═══ -->
<section class="section" id="s3" style="--glow: rgba(99,102,241,0.06)">
  <span class="section-label">03 — Typewriter Decode</span>
  <button class="replay-btn" onclick="playV3()">Replay</button>
  <div class="hero-text-3" id="hero3"></div>
</section>

<!-- ═══ Variant 4: 3D Perspective Flip ═══ -->
<section class="section" id="s4" style="--glow: rgba(236,72,153,0.08)">
  <span class="section-label">04 — 3D Flip</span>
  <button class="replay-btn" onclick="playV4()">Replay</button>
  <div class="hero-text-4" id="hero4">
    <span class="line" id="line4a"></span>
    <span class="line" id="line4b"></span>
  </div>
</section>

<script>
/* ─── Utilities ─── */
function splitToChars(container, text, delayStep = 40, startDelay = 0) {
  container.innerHTML = '';
  const chars = [];
  for (let i = 0; i < text.length; i++) {
    if (text[i] === ' ') {
      container.appendChild(document.createTextNode(' '));
      chars.push(null);
    } else {
      const span = document.createElement('span');
      span.className = 'char';
      span.textContent = text[i];
      span.style.setProperty('--d', `${startDelay + i * delayStep}ms`);
      container.appendChild(span);
      chars.push(span);
    }
  }
  return chars;
}

function splitToWords(container, text, delayStep = 120, startDelay = 0, highlightWords = []) {
  container.innerHTML = '';
  const words = text.split(' ');
  const spans = [];
  words.forEach((word, i) => {
    const span = document.createElement('span');
    span.className = 'word' + (highlightWords.includes(word) ? ' highlight' : '');
    span.textContent = word;
    span.style.setProperty('--d', `${startDelay + i * delayStep}ms`);
    container.appendChild(span);
    spans.push(span);
  });
  return spans;
}

/* ─── Variant 1: Split Letter Rise ─── */
let chars1a = [], chars1b = [];

function playV1() {
  const line1a = document.getElementById('line1a');
  const line1b = document.getElementById('line1b');
  chars1a = splitToChars(line1a, 'Creative', 50);
  chars1b = splitToChars(line1b, 'Motion', 50, 250);

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      [...chars1a, ...chars1b].forEach(ch => {
        if (ch) ch.classList.add('visible');
      });
    });
  });
}

/* ─── Variant 2: Elastic Scale Pop ─── */
let words2 = [];

function playV2() {
  const hero2 = document.getElementById('hero2');
  words2 = splitToWords(hero2, 'Design is intelligence made visible', 120, 0, ['intelligence', 'visible']);

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      words2.forEach(w => w.classList.add('visible'));
    });
  });
}

/* ─── Variant 3: Typewriter Decode ─── */
const GLYPHS = '!@#$%^&*()_+-=[]{}|;:,./<>?~`0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
let v3Timeout = null;

function playV3() {
  if (v3Timeout) clearTimeout(v3Timeout);
  const hero3 = document.getElementById('hero3');
  const text = 'The future is now.';
  hero3.innerHTML = '';

  const spans = [];
  for (let i = 0; i < text.length; i++) {
    if (text[i] === ' ') {
      hero3.appendChild(document.createTextNode(' '));
      spans.push(null);
    } else {
      const span = document.createElement('span');
      span.className = 'char';
      hero3.appendChild(span);
      spans.push(span);
    }
  }

  const cursor = document.createElement('span');
  cursor.className = 'cursor-blink';
  hero3.appendChild(cursor);

  let idx = 0;
  function decodeNext() {
    if (idx >= spans.length) return;
    const span = spans[idx];
    if (!span) { idx++; decodeNext(); return; }

    let scrambleCount = 0;
    const maxScrambles = 4;

    function scramble() {
      if (scrambleCount < maxScrambles) {
        span.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
        span.className = 'char decoding';
        scrambleCount++;
        setTimeout(scramble, 40);
      } else {
        span.textContent = text[idx];
        span.className = 'char decoded';
        idx++;
        v3Timeout = setTimeout(decodeNext, 60);
      }
    }
    scramble();
  }

  setTimeout(decodeNext, 300);
}

/* ─── Variant 4: 3D Perspective Flip ─── */
let chars4a = [], chars4b = [];

function playV4() {
  const line4a = document.getElementById('line4a');
  const line4b = document.getElementById('line4b');
  chars4a = splitToChars(line4a, 'Transform', 45);
  chars4b = splitToChars(line4b, 'Everything', 45, 300);

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      [...chars4a, ...chars4b].forEach(ch => {
        if (ch) ch.classList.add('visible');
      });
    });
  });
}

/* ─── Intersection Observer for auto-play ─── */
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const id = entry.target.id;
      if (id === 's1') playV1();
      if (id === 's2') playV2();
      if (id === 's3') playV3();
      if (id === 's4') playV4();
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.4 });

document.querySelectorAll('.section').forEach(s => observer.observe(s));

/* Also play first section immediately */
setTimeout(playV1, 400);
</script>
</body>
</html>
