<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>滑动操作</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#111;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{width:100%;height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}

  .stage { width: 100%; min-height: 200px; display: flex; align-items: center; justify-content: center; padding: 32px; }

  /* 1. Toggle Switch */
  .toggle-track { width: 60px; height: 32px; background: #333; border-radius: 16px; position: relative; cursor: pointer; transition: background .3s; }
  .toggle-track.on { background: #667eea; }
  .toggle-thumb { width: 26px; height: 26px; background: #fff; border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: transform .3s cubic-bezier(.68,-.55,.27,1.55); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .toggle-track.on .toggle-thumb { transform: translateX(28px); }
  .toggle-icons { display: flex; gap: 24px; align-items: center; }
  .toggle-label { font-size: .85rem; color: #888; transition: color .3s; }
  .toggle-track.on ~ .toggle-label-on { color: #667eea; }

  /* 2. Animated Checkbox */
  .checkbox-wrap { display: flex; gap: 20px; }
  .cb { width: 28px; height: 28px; border: 2px solid #444; border-radius: 8px; position: relative; cursor: pointer; transition: all .3s; }
  .cb.checked { background: #667eea; border-color: #667eea; }
  .cb svg { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s .1s; }
  .cb.checked svg { stroke-dashoffset: 0; }

  /* 3. Like Heart */
  .heart-btn { width: 60px; height: 60px; background: none; border: none; cursor: pointer; position: relative; }
  .heart-btn svg { width: 40px; height: 40px; fill: #444; transition: fill .2s, transform .2s; }
  .heart-btn.liked svg { fill: #f5576c; animation: heartPop .4s ease; }
  @keyframes heartPop { 0%{ transform: scale(1);} 50%{ transform: scale(1.3);} 100%{ transform: scale(1);} }
  .heart-particles { position: absolute; inset: 0; pointer-events: none; }
  .heart-particle { position: absolute; width: 6px; height: 6px; border-radius: 50%; opacity: 0; }

  /* 4. Notification Badge */
  .bell-wrap { position: relative; cursor: pointer; }
  .bell-wrap svg { width: 36px; height: 36px; fill: #888; transition: fill .3s; }
  .bell-wrap:hover svg { fill: #fff; }
  .badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; background: #f5576c; color: #fff; border-radius: 10px; font-size: .7rem; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px; transform: scale(0); transition: transform .3s cubic-bezier(.68,-.55,.27,1.55); }
  .badge.show { transform: scale(1); }
  .badge.pop { animation: badgePop .4s ease; }
  @keyframes badgePop { 0%{ transform: scale(1);} 50%{ transform: scale(1.4);} 100%{ transform: scale(1);} }

  /* 5. Expanding Search */
  .search-wrap { position: relative; width: 50px; height: 50px; transition: width .4s cubic-bezier(.4,0,.2,1); border-radius: 25px;  overflow: hidden; cursor: pointer; display: flex; align-items: center; }
  .search-wrap.open { width: 260px; cursor: text; }
  .search-icon { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .search-icon svg { width: 20px; height: 20px; fill: none; stroke: #888; stroke-width: 2; }
  .search-input { border: none; background: none; color: #fff; font-size: .9rem; outline: none; width: 0; opacity: 0; transition: all .3s; padding: 0; }
  .search-wrap.open .search-input { width: 180px; opacity: 1; padding: 0 10px; }

  /* 6. Floating Action Button */
  .fab-wrap { position: relative; }
  .fab { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(102,126,234,.4); transition: transform .3s, box-shadow .3s; z-index: 2; position: relative; }
  .fab:hover { transform: scale(1.1); box-shadow: 0 6px 30px rgba(102,126,234,.6); }
  .fab svg { width: 24px; height: 24px; fill: #fff; transition: transform .3s; }
  .fab.open svg { transform: rotate(45deg); }
  .fab-item { position: absolute; width: 44px; height: 44px; border-radius: 50%;  border: 1px solid #333; display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(0); transition: all .3s cubic-bezier(.68,-.55,.27,1.55); cursor: pointer; }
  .fab-item svg { width: 18px; height: 18px; fill: #aaa; }
  .fab.open ~ .fab-item:nth-child(2) { opacity: 1; transform: scale(1) translateY(-70px); }
  .fab.open ~ .fab-item:nth-child(3) { opacity: 1; transform: scale(1) translate(-50px, -50px); transition-delay: .05s; }
  .fab.open ~ .fab-item:nth-child(4) { opacity: 1; transform: scale(1) translateX(-70px); transition-delay: .1s; }

  /* 7. Pull to Refresh */
  .pull-demo { width: 200px; height: 140px;  border-radius: 12px; overflow: hidden; position: relative; cursor: grab; }
  .pull-arrow { text-align: center; padding: 10px; color: #667eea; font-size: 1.2rem; transform: translateY(-40px); transition: transform .3s; }
  .pull-demo.pulling .pull-arrow { transform: translateY(0); }
  .pull-content { padding: 12px; font-size: .75rem; color: #666; }

  /* 8. Swipe Action */
  .swipe-item { width: 260px; height: 60px; position: relative; overflow: hidden; border-radius: 10px; }
  .swipe-bg { position: absolute; inset: 0; background: #f5576c; display: flex; align-items: center; justify-content: flex-end; padding: 0 20px; color: #fff; font-size: .85rem; font-weight: 600; border-radius: 10px; }
  .swipe-fg { position: absolute; inset: 0;  display: flex; align-items: center; padding: 0 20px; border-radius: 10px; cursor: grab; transition: transform .3s; font-size: .85rem; color: #ccc; }
  .swipe-item.swiped .swipe-fg { transform: translateX(-100px); }

  /* 9. Tooltip Hover */
  .tip-wrap { position: relative; display: inline-block; }
  .tip-trigger { padding: 10px 24px;  border: 1px solid #333; border-radius: 8px; color: #ccc; cursor: pointer; font-size: .85rem; }
  .tip-bubble { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%) translateY(10px); background: #333; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: .75rem; white-space: nowrap; opacity: 0; pointer-events: none; transition: all .3s cubic-bezier(.68,-.55,.27,1.55); }
  .tip-bubble::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #333; }
  .tip-wrap:hover .tip-bubble { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 10. Progress Steps */
  .steps { display: flex; align-items: center; gap: 0; }
  .step-dot { width: 32px; height: 32px; border-radius: 50%;  border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: .75rem; color: #666; cursor: pointer; transition: all .3s; position: relative; z-index: 1; }
  .step-dot.active { background: #667eea; border-color: #667eea; color: #fff; }
  .step-dot.done { background: #43e97b; border-color: #43e97b; color: #fff; }
  .step-line { width: 40px; height: 2px; background: #333; position: relative; }
  .step-line .fill { height: 100%; background: #43e97b; width: 0; transition: width .4s; }
  .step-line.filled .fill { width: 100%; }

  /* === EXPANDED === */

  /* 11. Ripple Button */
  .ripple-btn { padding: 14px 40px; background: linear-gradient(135deg,#667eea,#764ba2); border: none; border-radius: 12px; color: #fff; font-weight: 600; font-size: .95rem; cursor: pointer; position: relative; overflow: hidden; }
  .ripple-btn .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.3); transform: scale(0); animation: rippleExpand .6s ease-out; pointer-events: none; }
  @keyframes rippleExpand { to { transform: scale(4); opacity: 0; } }

  /* 12. Heart Like */
  .heart-btn { font-size: 2rem; cursor: pointer; transition: transform .2s; user-select: none; }
  .heart-btn:active { transform: scale(1.4); }
  .heart-btn.liked { color: #f5576c; }

  /* 13. Copy Feedback */
  .copy-btn { padding: 10px 24px;  border: 1px solid #333; border-radius: 8px; color: #ccc; cursor: pointer; transition: all .3s; font-family: inherit; }
  .copy-btn.copied { background: #43e97b; color: #000; border-color: #43e97b; }

  /* 14. Tooltip */
  .tooltip-wrap { position: relative; display: inline-block; }
  .tooltip-text { visibility: hidden; opacity: 0; position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%) translateY(8px);  border: 1px solid #333; padding: 6px 14px; border-radius: 8px; font-size: .75rem; color: #ccc; white-space: nowrap; transition: all .3s; pointer-events: none; }
  .tooltip-text::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: #1a1a2e; }
  .tooltip-wrap:hover .tooltip-text { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 15. Skeleton Loader */
  .skeleton { width: 200px; height: 14px; background: linear-gradient(90deg, #1a1a2e 25%, #2a2a3e 50%, #1a1a2e 75%); background-size: 200% 100%; animation: skeletonShimmer 1.5s ease-in-out infinite; border-radius: 6px; }
  @keyframes skeletonShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* 16. Drag Indicator */
  .drag-handle { width: 40px; display: flex; flex-direction: column; gap: 3px; align-items: center; cursor: grab; padding: 8px; border-radius: 8px; transition: background .2s; }
  .drag-handle:hover { background: #ffffff08; }
  .drag-handle span { width: 20px; height: 2px; background: #555; border-radius: 1px; }

  /* 17. Pill Toggle */
  .pill-toggle { display: flex;  border-radius: 30px; padding: 4px; border: 1px solid #333; }
  .pill-opt { padding: 8px 20px; border-radius: 26px; cursor: pointer; font-size: .8rem; color: #888; transition: all .3s; }
  .pill-opt.active { background: #667eea; color: #fff; }

  /* 18. Count Badge */
  .badge-wrap { position: relative; display: inline-block; }
  .badge-icon { font-size: 1.5rem; }
  .badge-count { position: absolute; top: -4px; right: -8px; background: #f5576c; color: #fff; font-size: .6rem; font-weight: 700; padding: 2px 6px; border-radius: 10px; min-width: 18px; text-align: center; animation: badgePop .3s cubic-bezier(.34,1.56,.64,1); }
  @keyframes badgePop { from { transform: scale(0); } to { transform: scale(1); } }

  /* 19. Slider Track */
  .slider-track { width: 200px; height: 6px;  border-radius: 3px; position: relative; }
  .slider-fill { height: 100%; width: 60%; background: linear-gradient(90deg,#667eea,#f093fb); border-radius: 3px; transition: width .3s; }
  .slider-thumb { width: 18px; height: 18px; background: #fff; border-radius: 50%; position: absolute; top: -6px; left: 60%; transform: translateX(-50%); box-shadow: 0 2px 8px rgba(0,0,0,.3); cursor: pointer; }

  /* 20. Confetti Button */
  .confetti-btn { padding: 14px 40px; background: linear-gradient(135deg,#f5576c,#ffa500); border: none; border-radius: 12px; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; position: relative; overflow: visible; }


</style>
</head>
<body>
<div class="stage">
        <div class="swipe-item" onclick="this.classList.toggle('swiped')">
          <div class="swipe-bg">Delete</div>
          <div class="swipe-fg">Swipe me (click)</div>
        </div>
      </div>
<script>// Heart
  function toggleHeart(btn) {
    btn.classList.toggle('liked');
  }

  // Notification
  let notifCount = 0;
  function addNotif() {
    notifCount++;
    const b = document.getElementById('notifBadge');
    b.textContent = notifCount;
    b.classList.add('show', 'pop');
    setTimeout(() => b.classList.remove('pop'), 400);
  }
  function clearNotif() {
    notifCount = 0;
    const b = document.getElementById('notifBadge');
    b.textContent = '0';
    b.classList.remove('show');
  }

  // Search
  function openSearch(wrap) {
    wrap.classList.add('open');
    wrap.querySelector('.search-input').focus();
    document.addEventListener('click', function handler(e) {
      if (!wrap.contains(e.target)) {
        wrap.classList.remove('open');
        document.removeEventListener('click', handler);
      }
    });
  }

  // Pull to refresh
  function startPull(el, e) {
    el.classList.add('pulling');
    setTimeout(() => el.classList.remove('pulling'), 1200);
  }

  // Progress Steps
  function setStep(idx) {
    const dots = document.querySelectorAll('#progressSteps .step-dot');
    const lines = document.querySelectorAll('#progressSteps .step-line');
    dots.forEach((d, i) => {
      d.classList.remove('active', 'done');
      if (i < idx) { d.classList.add('done'); d.innerHTML = '&#10003;'; }
      else if (i === idx) { d.classList.add('active'); d.textContent = i + 1; }
      else { d.textContent = i + 1; }
    });
    lines.forEach((l, i) => {
      if (i < idx) l.classList.add('filled');
      else l.classList.remove('filled');
    });
  }</script>
<script>function createRipple(e) {
  const btn = e.currentTarget;
  const r = btn.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const size = Math.max(r.width, r.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - r.left - size/2) + 'px';
  ripple.style.top = (e.clientY - r.top - size/2) + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
}
function copyFeedback(btn) {
  btn.textContent = 'Copied!';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'Copy Code'; btn.classList.remove('copied'); }, 1500);
}
function pillToggle(el) {
  el.parentElement.querySelectorAll('.pill-opt').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
}</script>
</body>
</html>
