<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Word Cycler · Fluid Text Morph</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --accent1: #a78bfa; --accent3: #f472b6; }
  body {
    background: #000;
    color: #fff;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
  }
  .label {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 48px;
    font-weight: 500;
  }
  .hero-line {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .hero-static {
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #fff;
    white-space: nowrap;
  }
  .morph-container {
    position: relative;
    display: inline-block;
  }
  .morph-word {
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 800;
    letter-spacing: -0.03em;
    position: absolute;
    top: 0;
    left: 0;
    white-space: nowrap;
    opacity: 0;
    filter: blur(12px);
    transition: opacity 0.7s ease, filter 0.7s ease;
    background: linear-gradient(135deg, var(--accent1), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .morph-word.active { opacity: 1; filter: blur(0px); }
  .morph-word.leaving { opacity: 0; filter: blur(14px); }
  .morph-sizer {
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 800;
    letter-spacing: -0.03em;
    white-space: nowrap;
    visibility: hidden;
    pointer-events: none;
    background: linear-gradient(135deg, var(--accent1), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .section-desc {
    font-size: 14px;
    color: #444;
    margin-top: 48px;
    text-align: center;
    max-width: 480px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<p class="label">Variant 01 · Hero Word Cycler</p>

<div class="hero-line">
  <span class="hero-static">We</span>
  <div class="morph-container" id="morph1">
    <span class="morph-sizer" id="morph1-sizer">Design</span>
    <span class="morph-word active" data-index="0">Design</span>
    <span class="morph-word" data-index="1">Build</span>
    <span class="morph-word" data-index="2">Ship</span>
    <span class="morph-word" data-index="3">Launch</span>
    <span class="morph-word" data-index="4">Scale</span>
  </div>
  <span class="hero-static">Things.</span>
</div>

<p class="section-desc">
  SVG gooey filter (feGaussianBlur + feColorMatrix) 让文字边缘在切换时产生液态粘连感，
  模拟液体凝固与融化的视觉效果。
</p>

<script>
const v1Words = document.querySelectorAll('#morph1 .morph-word');
const v1Sizer = document.getElementById('morph1-sizer');
v1Sizer.textContent = v1Words[0].textContent;

let v1Current = 0;
function v1Next() {
  const prev = v1Current;
  v1Current = (v1Current + 1) % v1Words.length;
  v1Words[prev].classList.remove('active');
  v1Words[prev].classList.add('leaving');
  v1Sizer.textContent = v1Words[v1Current].textContent;
  setTimeout(() => { v1Words[v1Current].classList.add('active'); }, 150);
  setTimeout(() => { v1Words[prev].classList.remove('leaving'); }, 700);
}
setInterval(v1Next, 2200);
</script>
</body>
</html>
