<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On-Scroll 3D Carousel</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #060606;
    --text: #f5f5f5;
    --accent: #6366f1;
    --card-w: 280px;
    --card-h: 380px;
    --items: 8;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x: hidden;
  }

  /* ─── Hero ─── */
  .hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
  }

  .hero h1 {
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1;
    background: linear-gradient(135deg, #fff 0%, #6366f1 60%, #a855f7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 1rem;
  }

  .hero p {
    color: #555;
    font-size: 1rem;
    max-width: 400px;
  }

  .hero .scroll-cue {
    position: absolute;
    bottom: 2rem;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #333;
  }

  .hero .scroll-cue::after {
    content: '';
    display: block;
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, #333, transparent);
    margin: 0.5rem auto 0;
    animation: fadeDown 2s ease-in-out infinite;
  }

  @keyframes fadeDown {
    0%, 100% { opacity: 0.3; transform: scaleY(0.8); }
    50% { opacity: 1; transform: scaleY(1.2); }
  }

  /* ─── Carousel Container ─── */
  .carousel-section {
    height: 300vh;
    position: relative;
  }

  .carousel-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
    overflow: hidden;
  }

  .carousel-ring {
    position: relative;
    width: var(--card-w);
    height: var(--card-h);
    transform-style: preserve-3d;
    transition: transform 0.1s ease-out;
  }

  .carousel-card {
    position: absolute;
    width: var(--card-w);
    height: var(--card-h);
    border-radius: 16px;
    overflow: hidden;
    backface-visibility: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transition: box-shadow 0.3s;
  }

  .carousel-card .card-face {
    width: 100%;
    height: 100%;
    background: var(--grad);
    position: relative;
  }

  /* Decorative pattern on cards */
  .carousel-card .card-face::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,0.1) 0%, transparent 50%),
      radial-gradient(circle at 70% 80%, rgba(255,255,255,0.05) 0%, transparent 40%);
  }

  .carousel-card .card-face::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.4) 100%);
  }

  .carousel-card .card-info {
    position: absolute;
    bottom: 1.25rem;
    left: 1.25rem;
    z-index: 2;
  }

  .carousel-card .card-info h3 {
    font-size: 1rem;
    font-weight: 700;
  }

  .carousel-card .card-info span {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.05em;
  }

  /* ─── Progress indicator ─── */
  .progress-bar {
    position: fixed;
    top: 50%;
    right: 2rem;
    transform: translateY(-50%);
    width: 3px;
    height: 120px;
    background: #1a1a1a;
    border-radius: 2px;
    z-index: 100;
  }

  .progress-fill {
    width: 100%;
    height: 0%;
    background: var(--accent);
    border-radius: 2px;
    transition: height 0.1s ease-out;
  }

  /* ─── Horizontal Scroll Carousel ─── */
  .h-section {
    padding: 6rem 0;
    overflow: hidden;
  }

  .h-section-header {
    text-align: center;
    margin-bottom: 3rem;
  }

  .h-section-header h2 {
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .h-section-header p {
    color: #555;
    font-size: 0.9rem;
    margin-top: 0.5rem;
  }

  .h-track {
    display: flex;
    gap: 1.5rem;
    padding: 2rem 3rem;
    animation: scrollX 30s linear infinite;
  }

  .h-track:hover { animation-play-state: paused; }

  @keyframes scrollX {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .h-card {
    flex: 0 0 250px;
    height: 340px;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .h-card:hover {
    transform: scale(1.05) translateY(-8px);
  }

  .h-card .card-face {
    width: 100%;
    height: 100%;
    background: var(--grad);
    position: relative;
  }

  .h-card .card-face::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 40% 30%, rgba(255,255,255,0.1) 0%, transparent 50%);
  }

  .h-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.5) 100%);
    pointer-events: none;
  }

  .h-card .h-label {
    position: absolute;
    bottom: 1rem;
    left: 1rem;
    z-index: 2;
    font-size: 0.8rem;
    font-weight: 600;
  }

  /* ─── Footer ─── */
  footer {
    text-align: center;
    padding: 4rem;
    font-size: 0.7rem;
    color: #222;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="hero">
  <h1>3D Carousel</h1>
  <p>Scroll to rotate a cylindrical carousel in 3D perspective space</p>
  <div class="scroll-cue">Scroll to spin</div>
</div>

<div class="progress-bar">
  <div class="progress-fill" id="progressFill"></div>
</div>

<!-- Main 3D Cylinder Carousel -->
<section class="carousel-section" id="carouselSection">
  <div class="carousel-sticky">
    <div class="carousel-ring" id="carouselRing"></div>
  </div>
</section>

<!-- Bonus: Auto-scroll horizontal track -->
<section class="h-section">
  <div class="h-section-header">
    <h2>Infinite Scroll</h2>
    <p>A bonus auto-scrolling horizontal carousel</p>
  </div>
  <div class="h-track" id="hTrack"></div>
</section>

<footer>073 — On-Scroll 3D Carousel</footer>

<script>
const GRADIENTS = [
  'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
  'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
  'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
  'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
  'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
  'linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)',
  'linear-gradient(135deg, #fccb90 0%, #d57eeb 100%)',
  'linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%)',
  'linear-gradient(160deg, #0093E9 0%, #80D0C7 100%)',
  'linear-gradient(160deg, #FBAB7E 0%, #F7CE68 100%)',
  'linear-gradient(160deg, #8EC5FC 0%, #E0C3FC 100%)',
  'linear-gradient(160deg, #D9AFD9 0%, #97D9E1 100%)',
];

const ITEMS = 8;
const ring = document.getElementById('carouselRing');
const section = document.getElementById('carouselSection');
const progressFill = document.getElementById('progressFill');

const labels = [
  { title: 'Perspective', sub: 'Depth & Space' },
  { title: 'Rotation', sub: '3D Transform' },
  { title: 'Parallax', sub: 'Layer Motion' },
  { title: 'Reflect', sub: 'Mirror World' },
  { title: 'Velocity', sub: 'Speed Flow' },
  { title: 'Gravity', sub: 'Weight Sense' },
  { title: 'Chromatic', sub: 'Color Shift' },
  { title: 'Infinity', sub: 'Endless Loop' },
];

// Build carousel cards in a cylinder
const angleStep = 360 / ITEMS;
const radius = 500;

for (let i = 0; i < ITEMS; i++) {
  const card = document.createElement('div');
  card.className = 'carousel-card';
  const angle = angleStep * i;
  card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
  card.innerHTML = `
    <div class="card-face" style="--grad: ${GRADIENTS[i]}"></div>
    <div class="card-info">
      <h3>${labels[i].title}</h3>
      <span>${labels[i].sub}</span>
    </div>
  `;
  ring.appendChild(card);
}

// Scroll-driven rotation
function updateCarousel() {
  const rect = section.getBoundingClientRect();
  const sectionHeight = section.offsetHeight - window.innerHeight;
  const scrolled = -rect.top;
  const progress = Math.max(0, Math.min(1, scrolled / sectionHeight));

  const rotation = progress * 360;
  ring.style.transform = `rotateY(${rotation}deg)`;
  progressFill.style.height = `${progress * 100}%`;

  requestAnimationFrame(updateCarousel);
}

requestAnimationFrame(updateCarousel);

// ─── Horizontal Auto-Scroll Track ───
const hTrack = document.getElementById('hTrack');
const hCount = 12;

for (let i = 0; i < hCount * 2; i++) {
  const card = document.createElement('div');
  card.className = 'h-card';
  card.innerHTML = `
    <div class="card-face" style="--grad: ${GRADIENTS[i % GRADIENTS.length]}"></div>
    <span class="h-label">${labels[i % ITEMS].title}</span>
  `;
  hTrack.appendChild(card);
}
</script>
</body>
</html>
