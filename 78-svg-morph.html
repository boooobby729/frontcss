<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Shape Morph</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

.page-header {
  text-align: center;
  padding: 60px 20px 20px;
}
.page-header h1 {
  font-size: clamp(28px, 5vw, 48px);
  font-weight: 700;
  letter-spacing: -0.02em;
}
.page-header p {
  margin-top: 10px;
  font-size: 14px;
  color: #555;
  letter-spacing: 0.04em;
}

.section {
  padding: 60px 40px;
  max-width: 1100px;
  margin: 0 auto;
}
.section-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #444;
  margin-bottom: 36px;
}

/* ── V1: Auto-cycling ── */
.v1-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
#v1-svg { width: 240px; height: 240px; overflow: visible; }
.shape-badge {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #666;
  min-width: 100px;
  text-align: center;
}
.controls {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.speed-label { font-size: 11px; color: #444; letter-spacing: 0.06em; }
.btn {
  padding: 7px 18px;
  border-radius: 8px;
  border: 1px solid #1e1e1e;
  background: #0d0d0d;
  color: #777;
  font-size: 11px;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: all 0.2s;
}
.btn:hover { background: #161616; color: #ccc; border-color: #2a2a2a; }
.btn.active { background: #12122a; color: #8080ff; border-color: #2a2a5a; }

/* ── V2: Hover cards ── */
.v2-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 20px;
}
.v2-card {
  background: #080808;
  border: 1px solid #161616;
  border-radius: 16px;
  padding: 28px 16px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: border-color 0.3s, background 0.3s;
  user-select: none;
}
.v2-card:hover { border-color: #2a2a2a; background: #0d0d0d; }
.v2-card svg { width: 96px; height: 96px; overflow: visible; }
.v2-card-label { font-size: 10px; color: #444; letter-spacing: 0.08em; text-transform: uppercase; }

/* ── V3: Multi-stage ── */
.v3-stage {
  width: 100%;
  height: 320px;
  background: #040404;
  border-radius: 20px;
  border: 1px solid #111;
  overflow: hidden;
}
#v3-svg { width: 100%; height: 100%; }

/* ── V4: Click to cycle ── */
.v4-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
#v4-svg { width: 260px; height: 260px; overflow: visible; cursor: pointer; }
.v4-hint { font-size: 12px; color: #444; letter-spacing: 0.06em; }
.v4-btns {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 4px;
}
.v4-btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid #1a1a1a;
  background: #0a0a0a;
  color: #555;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
}
.v4-btn:hover { background: #141414; color: #aaa; border-color: #2a2a2a; }
.v4-btn.active { background: #0d1a0d; color: #4ade80; border-color: #1a3a1a; }

hr.divider { border: none; border-top: 1px solid #0e0e0e; margin: 0 40px; }
</style>
</head>
<body>

<div class="page-header">
  <h1>SVG Shape Morph</h1>
  <p>Pure JS path interpolation · Zero dependencies · 4 variants</p>
</div>

<!-- ── V1: Auto-cycling ── -->
<div class="section">
  <div class="section-title">01 — Auto-cycling morph</div>
  <div class="v1-center">
    <svg id="v1-svg" viewBox="-120 -120 240 240">
      <defs>
        <linearGradient id="v1grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" id="v1g1" stop-color="#6366f1"/>
          <stop offset="100%" id="v1g2" stop-color="#ec4899"/>
        </linearGradient>
        <filter id="v1glow">
          <feGaussianBlur stdDeviation="7" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path id="v1path" fill="url(#v1grad)" filter="url(#v1glow)" opacity="0.92"/>
    </svg>
    <div class="shape-badge" id="v1name">circle</div>
    <div class="controls">
      <span class="speed-label">Speed:</span>
      <button class="btn" id="btn-slow" onclick="v1SetSpeed(0.5,this)">Slow</button>
      <button class="btn active" id="btn-norm" onclick="v1SetSpeed(1,this)">Normal</button>
      <button class="btn" id="btn-fast" onclick="v1SetSpeed(2,this)">Fast</button>
    </div>
  </div>
</div>

<hr class="divider">

<!-- ── V2: Hover cards ── -->
<div class="section">
  <div class="section-title">02 — Hover to morph</div>
  <div class="v2-grid" id="v2grid"></div>
</div>

<hr class="divider">

<!-- ── V3: Multi-shape symphony ── -->
<div class="section">
  <div class="section-title">03 — Multi-shape symphony</div>
  <div class="v3-stage">
    <svg id="v3-svg" viewBox="0 0 900 320" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="v3ga" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" id="v3ga1" stop-color="#06b6d4"/>
          <stop offset="100%" id="v3ga2" stop-color="#3b82f6"/>
        </linearGradient>
        <linearGradient id="v3gb" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" id="v3gb1" stop-color="#a855f7"/>
          <stop offset="100%" id="v3gb2" stop-color="#ec4899"/>
        </linearGradient>
        <linearGradient id="v3gc" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" id="v3gc1" stop-color="#10b981"/>
          <stop offset="100%" id="v3gc2" stop-color="#84cc16"/>
        </linearGradient>
        <linearGradient id="v3gd" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" id="v3gd1" stop-color="#f59e0b"/>
          <stop offset="100%" id="v3gd2" stop-color="#ef4444"/>
        </linearGradient>
        <filter id="v3glow">
          <feGaussianBlur stdDeviation="9" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="v3ga-g" transform="translate(112,160)"><path id="v3pa" fill="url(#v3ga)" filter="url(#v3glow)" opacity="0.88"/></g>
      <g id="v3gb-g" transform="translate(337,160)"><path id="v3pb" fill="url(#v3gb)" filter="url(#v3glow)" opacity="0.88"/></g>
      <g id="v3gc-g" transform="translate(563,160)"><path id="v3pc" fill="url(#v3gc)" filter="url(#v3glow)" opacity="0.88"/></g>
      <g id="v3gd-g" transform="translate(788,160)"><path id="v3pd" fill="url(#v3gd)" filter="url(#v3glow)" opacity="0.88"/></g>
    </svg>
  </div>
</div>

<hr class="divider">

<!-- ── V4: Click to cycle ── -->
<div class="section">
  <div class="section-title">04 — Click to transform</div>
  <div class="v4-center">
    <svg id="v4-svg" viewBox="-120 -120 240 240">
      <defs>
        <linearGradient id="v4grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" id="v4g1" stop-color="#f59e0b"/>
          <stop offset="100%" id="v4g2" stop-color="#ef4444"/>
        </linearGradient>
        <filter id="v4glow">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path id="v4path" fill="url(#v4grad)" filter="url(#v4glow)" opacity="0.92"/>
    </svg>
    <div class="v4-hint">click shape or buttons below</div>
    <div class="v4-btns" id="v4btns"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  CORE: shape generation & interpolation
// ═══════════════════════════════════════════════════════
const N = 64; // points per shape

function sampleCurve(fn, n) {
  return Array.from({length: n}, (_, i) => fn(i / n));
}

function lerp(a, b, t) { return a + (b - a) * t; }

function lerpPts(A, B, t) {
  return A.map((p, i) => [lerp(p[0], B[i][0], t), lerp(p[1], B[i][1], t)]);
}

// Catmull-Rom smooth path
function toPath(pts) {
  const n = pts.length;
  let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n];
    const p1 = pts[i];
    const p2 = pts[(i + 1) % n];
    const p3 = pts[(i + 2) % n];
    const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
    const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
    const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
    const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C${f(cp1x)} ${f(cp1y)},${f(cp2x)} ${f(cp2y)},${f(p2[0])} ${f(p2[1])}`;
  }
  return d + 'Z';
}
function f(v) { return v.toFixed(2); }

// Easing
function easeInOut(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2);
}
function easeOutElastic(t) {
  if (t === 0 || t === 1) return t;
  return Math.pow(2,-10*t)*Math.sin((t*10-0.75)*(2*Math.PI/3))+1;
}

// Hex color lerp
function lerpHex(c1, c2, t) {
  const h = s => [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)];
  const [r1,g1,b1] = h(c1), [r2,g2,b2] = h(c2);
  return '#' + [r1+(r2-r1)*t, g1+(g2-g1)*t, b1+(b2-b1)*t]
    .map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
}

// ═══════════════════════════════════════════════════════
//  SHAPE LIBRARY  (all centered at 0,0, radius ~90)
// ═══════════════════════════════════════════════════════
const R = 90;

const SHAPES = {
  circle: sampleCurve(t => {
    const a = t * Math.PI * 2;
    return [Math.cos(a)*R, Math.sin(a)*R];
  }, N),

  star5: sampleCurve(t => {
    const seg = Math.floor(t * 10);
    const lt  = (t * 10) % 1;
    const a0  = (seg / 10) * Math.PI * 2 - Math.PI/2;
    const a1  = ((seg+1) / 10) * Math.PI * 2 - Math.PI/2;
    const ra  = a0 + (a1 - a0) * lt;
    const r   = seg % 2 === 0 ? lerp(R, R*0.42, lt) : lerp(R*0.42, R, lt);
    return [Math.cos(ra)*r, Math.sin(ra)*r];
  }, N),

  heart: sampleCurve(t => {
    const a = t * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(a), 3);
    const y = -(13*Math.cos(a) - 5*Math.cos(2*a) - 2*Math.cos(3*a) - Math.cos(4*a));
    return [x * 5.4, y * 5.4];
  }, N),

  blob: sampleCurve(t => {
    const a = t * Math.PI * 2;
    const r = R*0.82 + 18*Math.sin(3*a+0.5) + 11*Math.cos(5*a) + 7*Math.sin(7*a+1.2);
    return [Math.cos(a)*r, Math.sin(a)*r];
  }, N),

  drop: sampleCurve(t => {
    const a = t * Math.PI * 2;
    const r = R * (1 - 0.44 * Math.cos(a));
    return [Math.sin(a)*r, -Math.cos(a)*r + 8];
  }, N),

  hexagon: sampleCurve(t => {
    const sides = 6;
    const seg = Math.floor(t * sides);
    const lt  = (t * sides) % 1;
    const a0  = (seg / sides) * Math.PI * 2 - Math.PI/6;
    const a1  = ((seg+1) / sides) * Math.PI * 2 - Math.PI/6;
    return [
      lerp(Math.cos(a0)*R, Math.cos(a1)*R, lt),
      lerp(Math.sin(a0)*R, Math.sin(a1)*R, lt)
    ];
  }, N),

  star6: sampleCurve(t => {
    const seg = Math.floor(t * 12);
    const lt  = (t * 12) % 1;
    const a0  = (seg / 12) * Math.PI * 2 - Math.PI/2;
    const a1  = ((seg+1) / 12) * Math.PI * 2 - Math.PI/2;
    const ra  = a0 + (a1 - a0) * lt;
    const r   = seg % 2 === 0 ? lerp(R, R*0.5, lt) : lerp(R*0.5, R, lt);
    return [Math.cos(ra)*r, Math.sin(ra)*r];
  }, N),

  flower: sampleCurve(t => {
    const a = t * Math.PI * 2;
    const r = R*0.58 + R*0.38 * Math.cos(5*a);
    return [Math.cos(a)*r, Math.sin(a)*r];
  }, N),

  squircle: sampleCurve(t => {
    const a = t * Math.PI * 2;
    const n = 4;
    const r = R / Math.pow(Math.pow(Math.abs(Math.cos(a)), n) + Math.pow(Math.abs(Math.sin(a)), n), 1/n);
    return [Math.cos(a)*r, Math.sin(a)*r];
  }, N),

  wave: sampleCurve(t => {
    const a = t * Math.PI * 2;
    const r = R * (0.75 + 0.25 * Math.sin(8*a));
    return [Math.cos(a)*r, Math.sin(a)*r];
  }, N),
};

const SHAPE_KEYS = Object.keys(SHAPES);

// Gradient palettes
const PALETTES = {
  circle:   ['#6366f1','#ec4899'],
  star5:    ['#f59e0b','#ef4444'],
  heart:    ['#ec4899','#f43f5e'],
  blob:     ['#06b6d4','#3b82f6'],
  drop:     ['#10b981','#06b6d4'],
  hexagon:  ['#a855f7','#6366f1'],
  star6:    ['#f59e0b','#a855f7'],
  flower:   ['#ec4899','#a855f7'],
  squircle: ['#84cc16','#10b981'],
  wave:     ['#38bdf8','#818cf8'],
};

// ═══════════════════════════════════════════════════════
//  VARIANT 1 — Auto-cycling morph
// ═══════════════════════════════════════════════════════
(function() {
  const pathEl = document.getElementById('v1path');
  const nameEl = document.getElementById('v1name');
  const g1 = document.getElementById('v1g1');
  const g2 = document.getElementById('v1g2');

  let fromIdx = 0, toIdx = 1;
  let progress = 0, speedMult = 1;
  let lastTs = null;
  const DURATION = 1600;

  window.v1SetSpeed = function(s, btn) {
    speedMult = s;
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };

  function tick(ts) {
    if (!lastTs) lastTs = ts;
    progress += (ts - lastTs) / DURATION * speedMult;
    lastTs = ts;

    if (progress >= 1) {
      progress -= 1;
      fromIdx = toIdx;
      toIdx = (toIdx + 1) % SHAPE_KEYS.length;
    }

    const t = easeInOut(progress);
    const fk = SHAPE_KEYS[fromIdx], tk = SHAPE_KEYS[toIdx];
    pathEl.setAttribute('d', toPath(lerpPts(SHAPES[fk], SHAPES[tk], t)));

    const [fc1,fc2] = PALETTES[fk], [tc1,tc2] = PALETTES[tk];
    g1.setAttribute('stop-color', lerpHex(fc1, tc1, t));
    g2.setAttribute('stop-color', lerpHex(fc2, tc2, t));
    nameEl.textContent = t < 0.5 ? fk : tk;

    requestAnimationFrame(tick);
  }
  pathEl.setAttribute('d', toPath(SHAPES[SHAPE_KEYS[0]]));
  requestAnimationFrame(tick);
})();

// ═══════════════════════════════════════════════════════
//  VARIANT 2 — Hover morph cards
// ═══════════════════════════════════════════════════════
(function() {
  const grid = document.getElementById('v2grid');
  const pairs = [
    { from:'circle',   to:'star5',    label:'Circle → Star',    c:['#6366f1','#f59e0b'] },
    { from:'heart',    to:'blob',     label:'Heart → Blob',     c:['#ec4899','#06b6d4'] },
    { from:'hexagon',  to:'flower',   label:'Hex → Flower',     c:['#a855f7','#ec4899'] },
    { from:'drop',     to:'star6',    label:'Drop → Star6',     c:['#10b981','#f59e0b'] },
    { from:'squircle', to:'wave',     label:'Squircle → Wave',  c:['#84cc16','#38bdf8'] },
    { from:'blob',     to:'circle',   label:'Blob → Circle',    c:['#06b6d4','#6366f1'] },
  ];

  const SC = 50 / R; // scale to fit 100x100 viewBox

  pairs.forEach((pair, i) => {
    const uid = `v2c${i}`;
    const card = document.createElement('div');
    card.className = 'v2-card';
    card.innerHTML = `
      <svg viewBox="-55 -55 110 110" overflow="visible">
        <defs>
          <linearGradient id="${uid}g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${pair.c[0]}"/>
            <stop offset="100%" stop-color="${pair.c[1]}"/>
          </linearGradient>
          <filter id="${uid}f">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path id="${uid}p" fill="url(#${uid}g)" filter="url(#${uid}f)" opacity="0.9"/>
      </svg>
      <div class="v2-card-label">${pair.label}</div>`;
    grid.appendChild(card);

    const pathEl = document.getElementById(`${uid}p`);
    const fromPts = SHAPES[pair.from].map(p => [p[0]*SC, p[1]*SC]);
    const toPts   = SHAPES[pair.to  ].map(p => [p[0]*SC, p[1]*SC]);
    pathEl.setAttribute('d', toPath(fromPts));

    let prog = 0, dir = 0, rafId = null;

    function animate() {
      prog = Math.max(0, Math.min(1, prog + dir * 0.03));
      pathEl.setAttribute('d', toPath(lerpPts(fromPts, toPts, easeOutBack(prog))));
      if ((dir > 0 && prog < 1) || (dir < 0 && prog > 0)) {
        rafId = requestAnimationFrame(animate);
      } else { rafId = null; }
    }

    card.addEventListener('mouseenter', () => { dir = 1; if (!rafId) rafId = requestAnimationFrame(animate); });
    card.addEventListener('mouseleave', () => { dir = -1; if (!rafId) rafId = requestAnimationFrame(animate); });
  });
})();

// ═══════════════════════════════════════════════════════
//  VARIANT 3 — Multi-shape symphony
// ═══════════════════════════════════════════════════════
(function() {
  const actors = [
    { pathId:'v3pa', g1:'v3ga1', g2:'v3ga2', seq:['circle','blob','flower','star5'],   speed:0.0006, phase:0    },
    { pathId:'v3pb', g1:'v3gb1', g2:'v3gb2', seq:['heart','drop','blob','circle'],     speed:0.0009, phase:1.5  },
    { pathId:'v3pc', g1:'v3gc1', g2:'v3gc2', seq:['hexagon','star6','flower','blob'],  speed:0.0007, phase:3.0  },
    { pathId:'v3pd', g1:'v3gd1', g2:'v3gd2', seq:['star5','wave','squircle','star6'], speed:0.001,  phase:4.5  },
  ];

  const SC3 = 60 / R;
  const hueOffsets = [190, 280, 150, 30];

  actors.forEach((a, ai) => {
    const pathEl = document.getElementById(a.pathId);
    const g1El   = document.getElementById(a.g1);
    const g2El   = document.getElementById(a.g2);
    let time = a.phase;

    function tick() {
      time += a.speed;
      // oscillate 0→1→0 using sin
      const raw = (Math.sin(time) + 1) / 2;
      const total = a.seq.length - 1;
      const fi = Math.min(Math.floor(raw * total), total - 1);
      const lt = easeInOut((raw * total) - fi);
      const fk = a.seq[fi], tk = a.seq[fi + 1];
      const pts = lerpPts(
        SHAPES[fk].map(p => [p[0]*SC3, p[1]*SC3]),
        SHAPES[tk].map(p => [p[0]*SC3, p[1]*SC3]),
        lt
      );
      pathEl.setAttribute('d', toPath(pts));

      // Animate gradient hue
      const hue = (hueOffsets[ai] + time * 25) % 360;
      g1El.setAttribute('stop-color', `hsl(${hue},85%,65%)`);
      g2El.setAttribute('stop-color', `hsl(${(hue+70)%360},85%,55%)`);

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
})();

// ═══════════════════════════════════════════════════════
//  VARIANT 4 — Click to cycle through shapes
// ═══════════════════════════════════════════════════════
(function() {
  const pathEl = document.getElementById('v4path');
  const svgEl  = document.getElementById('v4-svg');
  const g1El   = document.getElementById('v4g1');
  const g2El   = document.getElementById('v4g2');
  const btnsEl = document.getElementById('v4btns');

  let curIdx = 0, fromPts = null, toPts = null;
  let prog = 1, rafId = null;
  let fromPal = PALETTES[SHAPE_KEYS[0]], toPal = PALETTES[SHAPE_KEYS[0]];

  // Build buttons
  SHAPE_KEYS.forEach((key, i) => {
    const btn = document.createElement('button');
    btn.className = 'v4-btn' + (i === 0 ? ' active' : '');
    btn.textContent = key;
    btn.dataset.idx = i;
    btn.addEventListener('click', () => morphTo(i));
    btnsEl.appendChild(btn);
  });

  function morphTo(idx) {
    if (idx === curIdx) return;
    fromPts = lerpPts(
      SHAPES[SHAPE_KEYS[curIdx]],
      SHAPES[SHAPE_KEYS[curIdx]],
      prog < 1 ? prog : 1
    );
    // If mid-animation, start from current interpolated state
    if (prog < 1 && toPts) {
      fromPts = lerpPts(SHAPES[SHAPE_KEYS[curIdx]], toPts, easeOutElastic(prog));
    }
    fromPal = PALETTES[SHAPE_KEYS[curIdx]];
    toPal   = PALETTES[SHAPE_KEYS[idx]];
    curIdx  = idx;
    toPts   = SHAPES[SHAPE_KEYS[idx]];
    prog    = 0;

    document.querySelectorAll('.v4-btn').forEach(b => b.classList.remove('active'));
    btnsEl.children[idx].classList.add('active');

    if (!rafId) rafId = requestAnimationFrame(animate);
  }

  function animate() {
    prog = Math.min(prog + 0.022, 1);
    const t = easeOutElastic(prog);
    const pts = lerpPts(fromPts || SHAPES[SHAPE_KEYS[0]], toPts || SHAPES[SHAPE_KEYS[0]], t);
    pathEl.setAttribute('d', toPath(pts));
    g1El.setAttribute('stop-color', lerpHex(fromPal[0], toPal[0], prog));
    g2El.setAttribute('stop-color', lerpHex(fromPal[1], toPal[1], prog));
    if (prog < 1) { rafId = requestAnimationFrame(animate); }
    else { rafId = null; }
  }

  // Init
  fromPts = SHAPES[SHAPE_KEYS[0]];
  toPts   = SHAPES[SHAPE_KEYS[0]];
  pathEl.setAttribute('d', toPath(SHAPES[SHAPE_KEYS[0]]));

  // Click on SVG cycles to next shape
  svgEl.addEventListener('click', () => {
    morphTo((curIdx + 1) % SHAPE_KEYS.length);
  });
})();
</script>
</body>
</html>
