<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>文字拆散</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#111;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{width:100%;height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}


  /* 1. Gradient Flow */
  .gradient-flow { font-size: 3rem; font-weight: 800; background: linear-gradient(90deg, #667eea, #f093fb, #f5576c, #43e97b, #667eea); background-size: 300% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: gradFlow 4s linear infinite; }
  @keyframes gradFlow { to { background-position: -300% 0; } }

  /* 2. Neon */
  .neon { font-size: 3rem; font-weight: 700; color: #fff; text-shadow: 0 0 7px #fff, 0 0 10px #fff, 0 0 21px #fff, 0 0 42px #0fa, 0 0 82px #0fa, 0 0 92px #0fa, 0 0 102px #0fa, 0 0 151px #0fa; animation: neonFlicker2 3s infinite; }
  @keyframes neonFlicker2 { 0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { text-shadow: 0 0 7px #fff, 0 0 10px #fff, 0 0 21px #fff, 0 0 42px #0fa, 0 0 82px #0fa, 0 0 92px #0fa; } 20%, 24%, 55% { text-shadow: none; } }

  /* 3. Glitch */
  .glitch { font-size: 3rem; font-weight: 900; position: relative; color: #fff; letter-spacing: 3px; }
  .glitch::before, .glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .glitch::before { color: #f0f; animation: glitch1 2s infinite linear; clip-path: inset(0 0 60% 0); }
  .glitch::after { color: #0ff; animation: glitch2 2s infinite linear; clip-path: inset(40% 0 0 0); }
  @keyframes glitc 20% { transform: translate(-3px, 3px); } 40% { transform: translate(3px, -3px); } 60% { transform: translate(-2px, 1px); } 80% { transform: translate(2px, -2px); } 100% { transform: translate(0); } }
  @keyframes glitch2 { 0% { transform: translate(0); } 20% { transform: translate(3px, -2px); } 40% { transform: translate(-3px, 2px); } 60% { transform: translate(2px, -1px); } 80% { transform: translate(-2px, 3px); } 100% { transform: translate(0); } }

  /* 4. Typewriter */
  .typewriter { font-family: 'Courier New', monospace; font-size: 1.4rem; overflow: hidden; white-space: nowrap; border-right: 3px solid #667eea; width: 0; animation: typeWrite 3s steps(20) 1s forwards, blinkCur .7s step-end infinite; }
  @keyframes typeWrite { to { width: 20ch; } }
  @keyframes blinkCur { 0%, 100% { border-color: #667eea; } 50% { border-color: transparent; } }

  /* 5. Stroke Reveal */
  .stroke-reveal { font-size: 3rem; font-weight: 900; -webkit-text-stroke: 2px #667eea; color: transparent; animation: strokeFill 3s ease forwards infinite alternate; }
  @keyframes strokeFill { 0% { color: transparent; } 100% { color: #667eea; } }

  /* 6. Wave */
  .wave-text { display: flex; font-size: 2.4rem; font-weight: 800; }
  .wave-text span { display: inline-block; animation: waveChar 2s ease-in-out infinite; color: #f5576c; }
  .wave-text span:nth-child(1) { animation-delay: 0s; } .wave-text span:nth-child(2) { animation-delay: .1s; }
  .wave-text span:nth-child(3) { animation-delay: .2s; } .wave-text span:nth-child(4) { animation-delay: .3s; }
  .wave-text span:nth-child(5) { animation-delay: .4s; } .wave-text span:nth-child(6) { animation-delay: .5s; }
  .wave-text span:nth-child(7) { animation-delay: .6s; } .wave-text span:nth-child(8) { animation-delay: .7s; }
  @keyframes waveChar { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-15px) rotate(-5deg); } 50% { transform: translateY(0) rotate(0); } }

  /* 7. 3D Shadow */
  .shadow-3d { font-size: 3rem; font-weight: 900; color: #764ba2; text-shadow: 1px 1px 0 #5a3580, 2px 2px 0 #4a2870, 3px 3px 0 #3a1b60, 4px 4px 0 #2a0e50, 5px 5px 0 #1a0140, 6px 6px 10px rgba(0,0,0,.5); animation: shadow3dFloat 3s ease-in-out infinite; }
  @keyframes shadow3dFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); text-shadow: 1px 1px 0 #5a3580, 2px 2px 0 #4a2870, 3px 3px 0 #3a1b60, 4px 4px 0 #2a0e50, 5px 5px 0 #1a0140, 8px 12px 20px rgba(0,0,0,.4); } }

  /* 8. Gradient Mask */
  .clip-text { font-size: 3rem; font-weight: 900; background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #f5576c); background-size: 200% 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: clipBg 5s ease infinite; }
  @keyframes clipBg { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  /* 9. Scatter */
  .scatter-text { display: flex; gap: 2px; font-size: 2.4rem; font-weight: 800; }
  .scatter-text span { display: inline-block; animation: scatterUp 4s ease-in-out infinite; color: #43e97b; }
  .scatter-text span:nth-child(even) { animation-name: scatterDown; }
  .scatter-text span:nth-child(1) { animation-delay: 0s; } .scatter-text span:nth-child(2) { animation-delay: .08s; }
  .scatter-text span:nth-child(3) { animation-delay: .16s; } .scatter-text span:nth-child(4) { animation-delay: .24s; }
  .scatter-text span:nth-child(5) { animation-delay: .32s; } .scatter-text span:nth-child(6) { animation-delay: .40s; }
  .scatter-text span:nth-child(7) { animation-delay: .48s; }
  @keyframes scatterUp { 0%, 30%, 70%, 100% { transform: translate(0, 0) rotate(0); opacity: 1; } 50% { transform: translate(-10px, -30px) rotate(-15deg); opacity: .3; } }
  @keyframes scatterDown { 0%, 30%, 70%, 100% { transform: translate(0, 0) rotate(0); opacity: 1; } 50% { transform: translate(10px, 20px) rotate(10deg); opacity: .3; } }

  /* 10. Mirror */
  .mirror-wrap { text-align: center; }
  .mirror-text { font-size: 2.8rem; font-weight: 900; color: #fff; display: block; }
  .mirror-reflect { font-size: 2.8rem; font-weight: 900; display: block; transform: scaleY(-1); background: linear-gradient(to bottom, rgba(255,255,255,.3), transparent); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin-top: -4px; }

  /* === NEW EFFECTS === */

  /* 11. Text Shadow Bounce */
  .shadow-bounce { font-size: 2.6rem; font-weight: 800; color: #f5576c; animation: shadowBounce 2s ease-in-out infinite; }
  @keyframes shadowBounce { 0%, 100% { transform: translateY(0); text-shadow: 0 4px 6px rgba(245,87,108,.3); } 50% { transform: translateY(-10px); text-shadow: 0 20px 30px rgba(245,87,108,.15); } }

  /* 12. Retro Arcade */
  .retro-text { font-family: 'Courier New', monospace; font-size: 2rem; font-weight: 700; color: #0f0; text-shadow: 0 0 5px #0f0, 0 0 10px #0f0, 0 0 20px #0f0, 0 0 40px #008000; animation: retroScan 3s linear infinite; position: relative; }
  .retro-text::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0px, rgba(0,0,0,.15) 1px, transparent 2px); pointer-events: none; }
  @keyframes retroScan { 0%, 100% { opacity: 1; } 92% { opacity: 1; } 93% { opacity: .7; } 94% { opacity: 1; } }

  /* 13. Clip Reveal */
  .clip-reveal { font-size: 2.8rem; font-weight: 800; color: #667eea; animation: clipReveal 3s ease-in-out infinite; }
  @keyframes clipReveal { 0% { clip-path: inset(0 100% 0 0); } 50% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 0 0 100%); } }

  /* 14. Letter Spacing */
  .letter-expand { font-size: 2rem; font-weight: 700; color: #764ba2; letter-spacing: 0; animation: letterExpand 3s ease-in-out infinite; text-transform: uppercase; }
  @keyframes letterExpand { 0%, 100% { letter-spacing: 0; opacity: .5; } 50% { letter-spacing: 16px; opacity: 1; } }

  /* 15. Blur Reveal */
  .blur-reveal { font-size: 2.8rem; font-weight: 800; color: #fff; animation: blurReveal 3s ease-in-out infinite; }
  @keyframes blurReveal { 0% { filter: blur(20px); opacity: 0; } 30%, 70% { filter: blur(0); opacity: 1; } 100% { filter: blur(20px); opacity: 0; } }

  /* 16. Rainbow Cycle */
  .rainbow { font-size: 2.6rem; font-weight: 800; animation: rainbow 3s linear infinite; }
  @keyframes rainbow { 0% { color: #ff0000; } 17% { color: #ff8800; } 33% { color: #ffff00; } 50% { color: #00ff00; } 67% { color: #0088ff; } 83% { color: #8800ff; } 100% { color: #ff0000; } }

  /* 17. Underline Draw */
  .underline-draw { font-size: 2rem; font-weight: 600; color: #fff; position: relative; display: inline-block; }
  .underline-draw::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 3px; background: linear-gradient(90deg, #667eea, #f093fb); border-radius: 2px; animation: drawLine 2s ease-in-out infinite; }
  @keyframes drawLine { 0%, 100% { width: 0; left: 0; } 40% { width: 100%; left: 0; } 60% { width: 100%; left: 0; } 100% { width: 0; left: 100%; } }

  /* 18. Text Rotate X */
  .rotate-x { font-size: 2.4rem; font-weight: 800; color: #43e97b; animation: rotateX 3s ease-in-out infinite; perspective: 500px; }
  @keyframes rotateX { 0%, 100% { transform: rotateX(0deg); } 50% { transform: rotateX(360deg); } }

  /* 19. Shiny Sweep */
  .shiny { font-size: 2.6rem; font-weight: 800; color: #444; position: relative; display: inline-block; }
  .shiny::after { content: attr(data-text); position: absolute; top: 0; left: 0; background: linear-gradient(90deg, transparent 0%, #fff 50%, transparent 100%); background-size: 200% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shinySweep 3s linear infinite; }
  @keyframes shinySweep { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* 20. Rotate Letters */
  .rotate-letters { display: flex; font-size: 2rem; font-weight: 700; }
  .rotate-letters span { display: inline-block; animation: rotateLetter 2s ease-in-out infinite; color: #f093fb; }
  .rotate-letters span:nth-child(1) { animation-delay: 0s; } .rotate-letters span:nth-child(2) { animation-delay: .1s; }
  .rotate-letters span:nth-child(3) { animation-delay: .2s; } .rotate-letters span:nth-child(4) { animation-delay: .3s; }
  .rotate-letters span:nth-child(5) { animation-delay: .4s; } .rotate-letters span:nth-child(6) { animation-delay: .5s; }
  @keyframes rotateLetter { 0%, 100% { transform: rotateY(0deg); } 50% { transform: rotateY(360deg); } }

  /* 21. Fade In Up Text */
  .fade-in-up { font-size: 2.4rem; font-weight: 800; color: #667eea; animation: fadeInUpText 2.5s ease-in-out infinite; }
  @keyframes fadeInUpText { 0% { opacity: 0; transform: translateY(30px); } 30%, 70% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-30px); } }

  /* 22. Outline Pulse */
  .outline-pulse { font-size: 2.8rem; font-weight: 900; color: transparent; -webkit-text-stroke: 1px #f5576c; animation: outlinePulse 2s ease-in-out infinite; }
  @keyframes outlinePulse { 0%, 100% { -webkit-text-stroke-width: 1px; opacity: .5; } 50% { -webkit-text-stroke-width: 3px; opacity: 1; } }

  /* 23. Split Color */
  .split-color { font-size: 2.8rem; font-weight: 800; position: relative; color: #764ba2; }
  .split-color::after { content: attr(data-text); position: absolute; top: 0; left: 0; color: #f093fb; clip-path: inset(0 50% 0 0); animation: splitSlide 3s ease-in-out infinite; }
  @keyframes splitSlide { 0%, 100% { clip-path: inset(0 50% 0 0); } 50% { clip-path: inset(0 0 0 50%); } }

  /* 24. Smoke */
  .smoke-text { font-size: 2.6rem; font-weight: 800; color: #888; animation: smokeText 4s ease-in-out infinite; }
  @keyframes smokeText { 0%, 100% { filter: blur(0); opacity: 1; transform: translateY(0); } 50% { filter: blur(8px); opacity: .3; transform: translateY(-20px); } }

  /* 25. Highlight Slide */
  .highlight-text { font-size: 1.8rem; font-weight: 600; color: #fff; position: relative; display: inline-block; padding: 0 4px; }
  .highlight-text::before { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; background: linear-gradient(90deg, #667eea66, #f093fb66); z-index: -1; animation: highlightSlide 3s ease-in-out infinite; transform-origin: left; }
  @keyframes highlightSlide { 0% { transform: scaleX(0); } 30%, 70% { transform: scaleX(1); } 100% { transform: scaleX(0); transform-origin: right; } }

</style>
</head>
<body>
<div class="stage"><div class="scatter-text"><span>S</span><span>C</span><span>A</span><span>T</span><span>T</span><span>E</span><span>R</span></div></div>

</body>
</html>
