<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>创意按钮 - Bの宝库</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;min-height:100vh}
a{text-decoration:none;color:inherit}
.top-bar{position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 24px;display:flex;align-items:center;gap:12px;background:rgba(17,17,17,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06)}
.back-btn{color:rgba(255,255,255,.5);font-size:.8rem;padding:6px 12px;border-radius:6px;background:rgba(255,255,255,.06);transition:all .15s}
.back-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.page-title{font-size:1rem;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:-.02em}
.page-count{font-size:.7rem;color:rgba(255,255,255,.3);margin-left:4px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:rgba(255,255,255,.07);margin-top:57px}
.card{background:#111;cursor:pointer;transition:background .15s}
.card:hover{background:#161616}
.card:hover .card-visual,.card:hover .card-visual .stage{background:#161616 !important}
.card:hover .card-info{background:#161616}
.card-visual{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:#111 !important}
.card-visual .stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:16px;background:#111 !important}
.card-info{padding:10px 14px 14px;background:#111}
.card-info h3{font-size:.75rem;font-weight:500;color:rgba(255,255,255,.6);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-info .tag{display:block;font-size:.62rem;color:rgba(255,255,255,.25);margin-top:2px}
.effect-overlay{position:fixed;inset:0;z-index:9999;background:#111;display:none;flex-direction:column}
.effect-overlay.open{display:flex}
.effect-overlay iframe{width:100%;height:100%;border:none}
.effect-overlay-close{position:fixed;top:16px;right:20px;z-index:10000;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.effect-overlay-close:hover{background:rgba(255,255,255,.2)}
.effect-overlay-close svg{width:14px;height:14px;stroke:#fff;stroke-width:2}
@media(max-width:768px){.card-grid{grid-template-columns:repeat(2,1fr)}}

  .stage{width:100%;min-height:200px;display:flex;align-items:center;justify-content:center;padding:32px;gap:16px;flex-wrap:wrap}

  /* 1. Liquid Fill Button */
  .btn-liquid{position:relative;padding:14px 40px;background:transparent;border:2px solid #667eea;color:#667eea;font-size:1rem;font-weight:600;cursor:pointer;overflow:hidden;border-radius:8px;transition:color .4s;font-family:inherit}
  .btn-liquid::before{content:'';position:absolute;top:50%;left:50%;width:0;height:0;background:#667eea;border-radius:50%;transform:translate(-50%,-50%);transition:width .5s,height .5s;z-index:0}
  .btn-liquid:hover{color:#fff}
  .btn-liquid:hover::before{width:300px;height:300px}
  .btn-liquid span{position:relative;z-index:1}

  /* 2. Neon Glow Button */
  .btn-neon{padding:14px 40px;background:transparent;border:2px solid #43e97b;color:#43e97b;font-size:1rem;font-weight:600;cursor:pointer;border-radius:8px;position:relative;overflow:hidden;transition:all .3s;font-family:inherit;text-shadow:0 0 10px #43e97b66}
  .btn-neon:hover{background:#43e97b;color:#000;box-shadow:0 0 20px #43e97b88,0 0 40px #43e97b44,0 0 80px #43e97b22;text-shadow:none}

  /* 3. Gradient Border Spin */
  .btn-gradient-wrap{position:relative;padding:3px;border-radius:12px;background:conic-gradient(from 0deg,#667eea,#f093fb,#43e97b,#f5576c,#667eea);animation:gradSpin 3s linear infinite}
  @keyframes gradSpin{to{filter:hue-rotate(360deg)}}
  .btn-gradient-inner{display:block;padding:12px 36px;border-radius:9px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;border:none;font-family:inherit}

  /* 4. Pulse Ring Button */
  .btn-pulse-wrap{position:relative;display:inline-block}
  .btn-pulse{padding:14px 40px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:50px;font-size:1rem;font-weight:600;cursor:pointer;position:relative;z-index:1;font-family:inherit}
  .btn-pulse-wrap::before,.btn-pulse-wrap::after{content:'';position:absolute;inset:-6px;border-radius:50px;border:2px solid #667eea;opacity:0;animation:pulseRing 2s ease-out infinite}
  .btn-pulse-wrap::after{animation-delay:1s}
  @keyframes pulseRing{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}

  /* 5. Slide Arrow Button */
  .btn-arrow{padding:14px 56px 14px 32px;border:1px solid #333;color:#ccc;font-size:1rem;font-weight:600;cursor:pointer;border-radius:8px;position:relative;overflow:hidden;transition:all .3s;font-family:inherit}
  .btn-arrow::after{content:'\2192';position:absolute;right:20px;top:50%;transform:translateY(-50%);transition:right .3s,opacity .3s;opacity:.6}
  .btn-arrow:hover{padding-right:64px;border-color:#667eea;color:#fff}
  .btn-arrow:hover::after{right:16px;opacity:1}

  /* 6. Shutter Reveal */
  .btn-shutter{padding:14px 40px;background:#f5576c;color:#fff;border:none;font-size:1rem;font-weight:600;cursor:pointer;position:relative;overflow:hidden;border-radius:8px;font-family:inherit}
  .btn-shutter::before{content:attr(data-text);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#f5576c;transform:translateY(100%);transition:transform .3s}
  .btn-shutter:hover::before{transform:translateY(0)}

  /* 7. Outline Draw */
  .btn-draw{padding:14px 40px;background:transparent;color:#fff;border:none;font-size:1rem;font-weight:600;cursor:pointer;position:relative;font-family:inherit}
  .btn-draw::before,.btn-draw::after{content:'';position:absolute;width:0;height:0;border:2px solid transparent;transition:all .35s}
  .btn-draw::before{top:0;left:0;border-top-color:#f093fb;border-right-color:#f093fb}
  .btn-draw::after{bottom:0;right:0;border-bottom-color:#f093fb;border-left-color:#f093fb}
  .btn-draw:hover::before,.btn-draw:hover::after{width:100%;height:100%}

  /* 8. Click Ripple */
  .btn-ripple{padding:14px 40px;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;border:1px solid #333;font-size:1rem;font-weight:600;cursor:pointer;border-radius:8px;position:relative;overflow:hidden;font-family:inherit}
  .ripple-circle{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:rippleAnim .6s ease-out;pointer-events:none}
  @keyframes rippleAnim{to{transform:scale(4);opacity:0}}

  /* 9. 3D Press Button */
  .btn-3d{padding:14px 40px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;font-size:1rem;font-weight:600;cursor:pointer;border-radius:8px;box-shadow:0 6px 0 #4a3a8a,0 8px 20px rgba(0,0,0,.3);transition:all .1s;font-family:inherit;position:relative;top:0}
  .btn-3d:active{top:4px;box-shadow:0 2px 0 #4a3a8a,0 3px 10px rgba(0,0,0,.3)}

  /* 10. Magnetic Stretch */
  .btn-magnetic{padding:14px 40px;border:1px solid #43e97b;color:#43e97b;font-size:1rem;font-weight:600;cursor:pointer;border-radius:8px;transition:transform .2s,border-radius .3s;font-family:inherit}
  .btn-magnetic:hover{border-radius:24px}

  /* 11. Text Swap Button */
  .btn-swap{padding:14px 40px;border:1px solid #333;color:#ccc;font-size:1rem;font-weight:600;cursor:pointer;border-radius:8px;position:relative;overflow:hidden;height:50px;font-family:inherit}
  .btn-swap-inner{display:flex;flex-direction:column;transition:transform .3s;line-height:22px}
  .btn-swap:hover .btn-swap-inner{transform:translateY(-22px)}

  /* 12. Gradient Shift */
  .btn-gradshift{padding:14px 40px;background:linear-gradient(135deg,#667eea,#f093fb,#43e97b);background-size:300% 300%;color:#fff;border:none;font-size:1rem;font-weight:600;cursor:pointer;border-radius:8px;animation:gradShift 4s ease infinite;font-family:inherit}
  @keyframes gradShift{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}

  /* === EXPANDED === */

  /* 13. Magnetic Pull */
  .btn-magnetic { padding: 16px 40px; background: linear-gradient(135deg,#667eea,#764ba2); border: none; border-radius: 50px; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; transition: transform .2s; font-family: inherit; }

  /* 14. Text Reveal Button */
  .btn-text-reveal { padding: 16px 40px; background: transparent; border: 2px solid #fff; color: #fff; font-weight: 600; position: relative; overflow: hidden; cursor: pointer; font-size: .95rem; font-family: inherit; }
  .btn-text-reveal span { position: relative; z-index: 1; }
  .btn-text-reveal::before { content: ''; position: absolute; inset: 0; background: #fff; transform: translateY(100%); transition: transform .4s; }
  .btn-text-reveal:hover::before { transform: translateY(0); }
  .btn-text-reveal:hover { color: #0a0a0f; }

  /* 15. Icon Spin Button */
  .btn-icon-spin { padding: 14px 36px;  border: 1px solid #333; border-radius: 12px; color: #ccc; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: .95rem; font-family: inherit; }
  .btn-icon-spin .icon { transition: transform .4s; display: inline-block; }
  .btn-icon-spin:hover .icon { transform: rotate(360deg); }

  /* 16. Glitch Button */
  .btn-glitch { padding: 14px 40px;  border: 2px solid #f5576c; color: #f5576c; font-weight: 700; font-size: 1rem; cursor: pointer; position: relative; text-transform: uppercase; font-family: 'Courier New', monospace; }
  .btn-glitch:hover { animation: btnGlitch .3s infinite; }
  @keyframes btnGlitch { 0% { transform: translate(0); } 20% { transform: translate(-2px,1px); } 40% { transform: translate(2px,-1px); } 60% { transform: translate(-1px,2px); } 80% { transform: translate(1px,-2px); } 100% { transform: translate(0); } }

  /* 17. Gradient Shift */
  .btn-grad-shift { padding: 16px 40px; background: linear-gradient(135deg,#667eea,#f093fb,#43e97b); background-size: 200% 200%; border: none; border-radius: 12px; color: #fff; font-weight: 700; cursor: pointer; font-size: .95rem; animation: gradShiftBtn 3s ease infinite; font-family: inherit; }
  @keyframes gradShiftBtn { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

  /* 18. Underline Slide Button */
  .btn-underline { padding: 10px 4px; background: none; border: none; color: #ccc; font-size: 1rem; font-weight: 600; cursor: pointer; position: relative; font-family: inherit; }
  .btn-underline::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: #667eea; transition: width .4s; }
  .btn-underline:hover::after { width: 100%; }

  /* 19. Neon Button */
  .btn-neon { padding: 14px 40px; background: transparent; border: 2px solid #43e97b; color: #43e97b; font-weight: 700; cursor: pointer; font-size: .95rem; transition: all .3s; font-family: inherit; }
  .btn-neon:hover { background: #43e97b22; box-shadow: 0 0 20px #43e97b44, inset 0 0 20px #43e97b22; text-shadow: 0 0 8px #43e97b88; }

  /* 20. Send Button */
  .btn-send { padding: 14px 40px; background: #667eea; border: none; border-radius: 12px; color: #fff; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: .95rem; transition: all .3s; font-family: inherit; }
  .btn-send:hover { padding-right: 50px; }
  .btn-send .arrow { transition: transform .3s; display: inline-block; }
  .btn-send:hover .arrow { transform: translateX(8px); }


</style>
</head>
<body>
<div class="top-bar">
  <a href="../index.html" class="back-btn">← 返回</a>
  <span class="page-title">创意按钮</span>
  <span class="page-count">8 个效果</span>
</div>
<div class="card-grid">
    <div class="card" data-src="../_effects/174.html">
      <div class="card-visual"><div class="stage"><button class="btn-magnetic" onmousemove="let r=this.getBoundingClientRect(),x=event.clientX-r.left-r.width/2,y=event.clientY-r.top-r.height/2;this.style.transform='translate('+x*.2+'px,'+y*.2+'px)'" onmouseleave="this.style.transform=''">Magnetic</button></div></div>
      <div class="card-info"><h3>磁吸按钮</h3><span class="tag">transform translate follow</span></div>
    </div>
    <div class="card" data-src="../_effects/175.html">
      <div class="card-visual"><div class="stage"><button class="btn-text-reveal"><span>Reveal</span></button></div></div>
      <div class="card-info"><h3>文字揭示</h3><span class="tag">translateY fill reveal</span></div>
    </div>
    <div class="card" data-src="../_effects/176.html">
      <div class="card-visual"><div class="stage"><button class="btn-icon-spin"><span class="icon">⚙</span> Settings</button></div></div>
      <div class="card-info"><h3>图标旋转</h3><span class="tag">hover rotate icon</span></div>
    </div>
    <div class="card" data-src="../_effects/177.html">
      <div class="card-visual"><div class="stage"><button class="btn-glitch">GLITCH</button></div></div>
      <div class="card-info"><h3>故障按钮</h3><span class="tag">translate glitch shake</span></div>
    </div>
    <div class="card" data-src="../_effects/178.html">
      <div class="card-visual"><div class="stage"><button class="btn-grad-shift">Gradient</button></div></div>
      <div class="card-info"><h3>渐变流动</h3><span class="tag">background-position 动画</span></div>
    </div>
    <div class="card" data-src="../_effects/179.html">
      <div class="card-visual"><div class="stage"><button class="btn-underline">Learn More</button></div></div>
      <div class="card-info"><h3>下划线按钮</h3><span class="tag">::after width transition</span></div>
    </div>
    <div class="card" data-src="../_effects/180.html">
      <div class="card-visual"><div class="stage"><button class="btn-neon">Neon</button></div></div>
      <div class="card-info"><h3>霓虹按钮</h3><span class="tag">box-shadow glow</span></div>
    </div>
    <div class="card" data-src="../_effects/181.html">
      <div class="card-visual"><div class="stage"><button class="btn-send">Send <span class="arrow">→</span></button></div></div>
      <div class="card-info"><h3>发送按钮</h3><span class="tag">hover padding + arrow</span></div>
    </div>
</div>
<div class="effect-overlay" id="overlay">
  <button class="effect-overlay-close" id="overlayClose"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  <iframe id="overlayIframe" src="about:blank"></iframe>
</div>
<script>
const overlay=document.getElementById('overlay');
const iframe=document.getElementById('overlayIframe');
document.getElementById('overlayClose').addEventListener('click',()=>{overlay.classList.remove('open');iframe.src='about:blank';});
document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('open'),iframe.src='about:blank';});
document.querySelectorAll('.card').forEach(card=>{
  card.addEventListener('click',()=>{
    const src=card.dataset.src;
    if(src){iframe.src=src;overlay.classList.add('open');}
  });
});
function createRipple(e){
    const btn=e.currentTarget,c=document.createElement('span');
    c.className='ripple-circle';
    const r=btn.getBoundingClientRect();
    const sz=Math.max(r.width,r.height);
    c.style.width=c.style.height=sz+'px';
    c.style.left=(e.clientX-r.left-sz/2)+'px';
    c.style.top=(e.clientY-r.top-sz/2)+'px';
    btn.appendChild(c);
    c.addEventListener('animationend',()=>c.remove());
  }
  function magneticMove(e,el){
    const r=el.getBoundingClientRect();
    const x=e.clientX-r.left-r.width/2;
    const y=e.clientY-r.top-r.height/2;
    el.style.transform=`translate(${x*.2}px,${y*.2}px)`;
  }
</script>
</body>
</html>
