<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>悬浮放大</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#111;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{width:100%;height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}

  .stage{width:100%;min-height:240px;display:flex;align-items:center;justify-content:center;padding:24px;position:relative}

  /* Placeholder image boxes */
  .img-box{width:280px;height:180px;border-radius:12px;overflow:hidden;position:relative;cursor:pointer}
  .img-box img,.img-placeholder{width:100%;height:100%;object-fit:cover;display:block}
  .img-placeholder{background:linear-gradient(135deg,#1a1a2e,#2d1b4e);display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#555}

  /* 1. Overlay Reveal */
  .fx-overlay .overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(102,126,234,.9),rgba(118,75,162,.9));display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .4s;color:#fff;gap:8px}
  .fx-overlay:hover .overlay{opacity:1}
  .fx-overlay .overlay h4{font-size:1rem;transform:translateY(10px);transition:transform .4s}
  .fx-overlay:hover .overlay h4{transform:translateY(0)}
  .fx-overlay .overlay p{font-size:.75rem;opacity:.7;transform:translateY(10px);transition:transform .4s .1s}
  .fx-overlay:hover .overlay p{transform:translateY(0)}

  /* 2. Zoom Hover */
  .fx-zoom .inner-img{transition:transform .5s}
  .fx-zoom:hover .inner-img{transform:scale(1.15)}

  /* 3. Grayscale to Color */
  .fx-gray .inner-img{filter:grayscale(100%);transition:filter .5s}
  .fx-gray:hover .inner-img{filter:grayscale(0%)}

  /* 4. Tilt 3D */
  .fx-tilt{transition:transform .3s;perspective:600px}

  /* 5. Diagonal Reveal */
  .fx-diagonal{position:relative}
  .fx-diagonal .diag-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(243,89,135,.85),rgba(240,147,251,.85));clip-path:polygon(0 0,0 0,0 100%,0 100%);transition:clip-path .5s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.1rem}
  .fx-diagonal:hover .diag-overlay{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}

  /* 6. Split Hover */
  .fx-split{display:flex;width:280px;height:180px;border-radius:12px;overflow:hidden;cursor:pointer}
  .fx-split-half{flex:1;overflow:hidden;transition:flex .4s}
  .fx-split:hover .fx-split-half:nth-child(1){flex:1.5}
  .fx-split:hover .fx-split-half:nth-child(2){flex:.5}
  .fx-split-half .inner-img{width:280px;height:180px;object-fit:cover;display:block}
  .fx-split-half:nth-child(2) .inner-img{margin-left:-140px}

  /* 7. CSS Filter Blend */
  .fx-blend{position:relative}
  .fx-blend::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#667eea66,#f093fb66);mix-blend-mode:color;transition:opacity .4s;border-radius:12px}
  .fx-blend:hover::after{opacity:0}

  /* 8. Border Expand */
  .fx-border{border:0 solid #667eea;transition:border-width .3s,border-radius .3s}
  .fx-border:hover{border-width:6px;border-radius:20px}

  /* 9. Glitch Image */
  .fx-glitch{position:relative}
  .fx-glitch:hover{animation:imgGlitch .3s infinite}
  @keyframes imgGlitch{
    0%{clip-path:inset(20% 0 60% 0);transform:translate(-2px,0)}
    20%{clip-path:inset(60% 0 10% 0);transform:translate(2px,0)}
    40%{clip-path:inset(40% 0 30% 0);transform:translate(-1px,0)}
    60%{clip-path:inset(10% 0 70% 0);transform:translate(1px,0)}
    80%{clip-path:inset(50% 0 20% 0);transform:translate(-2px,0)}
    100%{clip-path:inset(0);transform:translate(0)}
  }

  /* 10. Shine Sweep */
  .fx-shine{position:relative}
  .fx-shine::after{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transition:left .6s}
  .fx-shine:hover::after{left:150%}

  /* === EXPANDED === */

  /* 11. Sepia Vintage */
  .img-sepia { width: 180px; height: 120px; background: linear-gradient(135deg,#667eea,#764ba2); border-radius: 12px; filter: sepia(.8) contrast(1.1); transition: filter .5s; }
  .img-sepia:hover { filter: sepia(0); }

  /* 12. Zoom on Hover */
  .img-zoom-wrap { width: 180px; height: 120px; overflow: hidden; border-radius: 12px; }
  .img-zoom-inner { width: 100%; height: 100%; background: linear-gradient(135deg,#43e97b,#38f9d7); transition: transform .5s; }
  .img-zoom-wrap:hover .img-zoom-inner { transform: scale(1.3); }

  /* 13. Duotone */
  .img-duotone { width: 180px; height: 120px; background: linear-gradient(135deg,#667eea,#f093fb); border-radius: 12px; position: relative; }
  .img-duotone::after { content: ''; position: absolute; inset: 0; background: #f5576c; mix-blend-mode: multiply; border-radius: 12px; transition: opacity .5s; }
  .img-duotone:hover::after { opacity: 0; }

  /* 14. Tilt 3D */
  .img-tilt { width: 180px; height: 120px; background: linear-gradient(135deg,#ffa500,#f5576c); border-radius: 12px; transition: transform .3s; }

  /* 15. Reveal Mask */
  .img-mask { width: 180px; height: 120px; background: linear-gradient(135deg,#667eea,#764ba2); border-radius: 12px; clip-path: circle(0% at 50% 50%); transition: clip-path .8s ease; }
  .img-mask:hover { clip-path: circle(100% at 50% 50%); }

  /* 16. Skew Hover */
  .img-skew { width: 180px; height: 120px; background: linear-gradient(135deg,#f093fb,#f5576c); border-radius: 12px; transition: transform .4s; }
  .img-skew:hover { transform: perspective(500px) rotateY(-10deg) skewY(2deg); }

  /* 17. Border Animate */
  .img-border-anim { width: 180px; height: 120px; background: linear-gradient(135deg,#43e97b,#667eea); border-radius: 12px; position: relative; }
  .img-border-anim::before { content: ''; position: absolute; inset: -3px; border-radius: 14px; background: conic-gradient(from 0deg, #667eea, #f093fb, #f5576c, #43e97b, #667eea); z-index: -1; animation: borderSpin 3s linear infinite; }
  @keyframes borderSpin { to { transform: rotate(360deg); } }

  /* 18. Glitch Image */
  .img-glitch { width: 180px; height: 120px; background: linear-gradient(135deg,#764ba2,#667eea); border-radius: 12px; position: relative; }
  .img-glitch:hover { animation: imgGlitch .3s infinite; }
  @keyframes imgGlitch { 0% { clip-path: inset(20% 0 60% 0); transform: translate(-2px); } 20% { clip-path: inset(60% 0 10% 0); transform: translate(2px); } 40% { clip-path: inset(40% 0 30% 0); transform: translate(-1px); } 60% { clip-path: inset(10% 0 70% 0); transform: translate(1px); } 80% { clip-path: inset(50% 0 20% 0); transform: translate(-2px); } 100% { clip-path: inset(0); transform: translate(0); } }

  /* 19. Ken Burns */
  .img-kenburns { width: 180px; height: 120px; overflow: hidden; border-radius: 12px; }
  .img-kenburns-inner { width: 100%; height: 100%; background: linear-gradient(135deg,#ffa500,#f093fb); animation: kenBurns 8s ease-in-out infinite; }
  @keyframes kenBurns { 0% { transform: scale(1) translate(0); } 50% { transform: scale(1.2) translate(-5%,-5%); } 100% { transform: scale(1) translate(0); } }

  /* 20. Frosted Overlay */
  .img-frost { width: 180px; height: 120px; background: linear-gradient(135deg,#667eea,#f093fb); border-radius: 12px; position: relative; overflow: hidden; }
  .img-frost-overlay { position: absolute; inset: 0; backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0); transition: backdrop-filter .5s; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; opacity: 0; transition: all .5s; }
  .img-frost:hover .img-frost-overlay { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);  opacity: 1; }


</style>
</head>
<body>
<div class="stage"><div class="img-zoom-wrap"><div class="img-zoom-inner"></div></div></div>
<script>function tiltImg(e,el){
    const r=el.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5;
    const y=(e.clientY-r.top)/r.height-.5;
    el.style.transform=`perspective(600px) rotateY(${x*20}deg) rotateX(${-y*20}deg)`;
  }</script>
</body>
</html>
