<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glitch Text Effects</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --text: #f0f0f0;
    --cyan: #00f5ff;
    --magenta: #ff00e5;
    --yellow: #ffe500;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── Sections ─── */
  .section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
    position: relative;
  }

  .section-tag {
    position: absolute;
    top: 2rem;
    left: 2rem;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #333;
  }

  /* ═══════════════════════════════════════
     EFFECT 1 — Classic RGB Glitch
  ═══════════════════════════════════════ */
  .glitch-1 {
    font-size: clamp(4rem, 12vw, 10rem);
    font-weight: 900;
    letter-spacing: -0.03em;
    position: relative;
    text-transform: uppercase;
    user-select: none;
  }

  .glitch-1::before,
  .glitch-1::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .glitch-1::before {
    color: var(--cyan);
    animation: glitch1Before 3s infinite;
    clip-path: inset(0 0 0 0);
  }

  .glitch-1::after {
    color: var(--magenta);
    animation: glitch1After 3s infinite;
    clip-path: inset(0 0 0 0);
  }

  @keyframes glitch1Before {
    0%, 100% { clip-path: inset(40% 0 50% 0); transform: translate(-3px, -2px); }
    5% { clip-path: inset(10% 0 80% 0); transform: translate(2px, 1px); }
    10% { clip-path: inset(60% 0 20% 0); transform: translate(-1px, 3px); }
    15% { clip-path: inset(30% 0 60% 0); transform: translate(3px, -1px); }
    20%, 95% { clip-path: inset(0 0 100% 0); transform: translate(0); }
  }

  @keyframes glitch1After {
    0%, 100% { clip-path: inset(50% 0 30% 0); transform: translate(3px, 2px); }
    5% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, -1px); }
    10% { clip-path: inset(20% 0 60% 0); transform: translate(1px, -3px); }
    15% { clip-path: inset(70% 0 10% 0); transform: translate(-3px, 1px); }
    20%, 95% { clip-path: inset(0 0 100% 0); transform: translate(0); }
  }

  /* Scanlines overlay */
  .glitch-1-wrap {
    position: relative;
  }

  .glitch-1-wrap::after {
    content: '';
    position: absolute;
    inset: -10%;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.1) 2px,
      rgba(0,0,0,0.1) 4px
    );
    pointer-events: none;
    animation: scanlines 0.1s linear infinite;
  }

  @keyframes scanlines {
    0% { transform: translateY(0); }
    100% { transform: translateY(4px); }
  }

  /* ═══════════════════════════════════════
     EFFECT 2 — Slice Glitch (Horizontal Cuts)
  ═══════════════════════════════════════ */
  .glitch-2 {
    font-size: clamp(3rem, 10vw, 8rem);
    font-weight: 900;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    position: relative;
    user-select: none;
  }

  .glitch-2 .slice {
    display: block;
    position: relative;
    overflow: hidden;
    line-height: 1;
  }

  .glitch-2 .slice:nth-child(1) { animation: slice1 4s infinite; }
  .glitch-2 .slice:nth-child(2) { animation: slice2 4s infinite 0.1s; }
  .glitch-2 .slice:nth-child(3) { animation: slice3 4s infinite 0.2s; }

  @keyframes slice1 {
    0%, 100% { transform: translateX(0); }
    5% { transform: translateX(10px); }
    6% { transform: translateX(-5px); }
    7%, 95% { transform: translateX(0); }
  }

  @keyframes slice2 {
    0%, 100% { transform: translateX(0); }
    5% { transform: translateX(-15px); }
    6% { transform: translateX(8px); }
    7%, 95% { transform: translateX(0); }
  }

  @keyframes slice3 {
    0%, 100% { transform: translateX(0); }
    5% { transform: translateX(12px); }
    6% { transform: translateX(-6px); }
    7%, 95% { transform: translateX(0); }
  }

  .glitch-2 .slice span {
    display: block;
    clip-path: var(--clip);
    color: var(--text);
    text-shadow:
      2px 0 var(--cyan),
      -2px 0 var(--magenta);
  }

  /* ═══════════════════════════════════════
     EFFECT 3 — Data Corruption (Random Chars)
  ═══════════════════════════════════════ */
  .glitch-3 {
    font-size: clamp(2.5rem, 7vw, 5rem);
    font-weight: 700;
    font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
    text-align: center;
    line-height: 1.4;
    letter-spacing: 0.02em;
  }

  .glitch-3 .char {
    display: inline-block;
    position: relative;
    transition: color 0.1s;
  }

  .glitch-3 .char.corrupt {
    color: var(--cyan);
    animation: jitter 0.1s linear infinite;
  }

  @keyframes jitter {
    0% { transform: translate(0, 0); }
    25% { transform: translate(1px, -1px); }
    50% { transform: translate(-1px, 1px); }
    75% { transform: translate(1px, 1px); }
    100% { transform: translate(-1px, -1px); }
  }

  /* ═══════════════════════════════════════
     EFFECT 4 — Hover Reveal Glitch
  ═══════════════════════════════════════ */
  .glitch-4-wrap {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    text-align: center;
  }

  .glitch-4 {
    font-size: clamp(3.5rem, 10vw, 8rem);
    font-weight: 900;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    position: relative;
    display: inline-block;
    cursor: pointer;
    user-select: none;
    transition: text-shadow 0.1s;
  }

  .glitch-4:hover {
    animation: glitch4Hover 0.3s linear infinite;
    text-shadow:
      3px 0 var(--cyan),
      -3px 0 var(--magenta),
      0 3px var(--yellow);
  }

  @keyframes glitch4Hover {
    0% { transform: translate(0); }
    20% { transform: translate(-3px, 2px); }
    40% { transform: translate(3px, -2px); }
    60% { transform: translate(-2px, -1px); }
    80% { transform: translate(2px, 1px); }
    100% { transform: translate(0); }
  }

  .glitch-4 .ghost {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    opacity: 0;
    color: var(--cyan);
    transition: opacity 0.1s;
    pointer-events: none;
  }

  .glitch-4:hover .ghost {
    opacity: 0.7;
    animation: ghostShift 0.2s linear infinite alternate;
  }

  @keyframes ghostShift {
    from { transform: translate(-4px, -2px); clip-path: inset(20% 0 40% 0); }
    to { transform: translate(4px, 2px); clip-path: inset(50% 0 20% 0); }
  }

  .glitch-4-hint {
    font-size: 0.75rem;
    color: #333;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 1rem;
  }

  /* ─── Background noise ─── */
  .noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
</style>
</head>
<body>

<div class="noise"></div>

<!-- Effect 1: Classic RGB Split -->
<section class="section">
  <span class="section-tag">01 — RGB Split</span>
  <div class="glitch-1-wrap">
    <div class="glitch-1" data-text="GLITCH">GLITCH</div>
  </div>
</section>

<!-- Effect 2: Horizontal Slice -->
<section class="section">
  <span class="section-tag">02 — Slice Shift</span>
  <div class="glitch-2">
    <span class="slice"><span style="--clip: inset(0 0 66% 0)">BROKEN</span></span>
    <span class="slice"><span style="--clip: inset(33% 0 33% 0)">BROKEN</span></span>
    <span class="slice"><span style="--clip: inset(66% 0 0 0)">BROKEN</span></span>
  </div>
</section>

<!-- Effect 3: Data Corruption -->
<section class="section">
  <span class="section-tag">03 — Data Corrupt</span>
  <div class="glitch-3" id="corruptText"></div>
</section>

<!-- Effect 4: Hover Glitch -->
<section class="section">
  <span class="section-tag">04 — Hover Trigger</span>
  <div class="glitch-4-wrap">
    <div class="glitch-4">
      ERROR
      <span class="ghost">ERROR</span>
    </div>
    <div class="glitch-4">
      404
      <span class="ghost">404</span>
    </div>
    <div class="glitch-4-hint">Hover to corrupt</div>
  </div>
</section>

<script>
// ─── Effect 3: Data Corruption Animation ───
const targetText = 'SYSTEM FAILURE\nDATA CORRUPTED';
const container = document.getElementById('corruptText');
const glyphs = '!@#$%^&*()_+-=[]{}|;:<>?/~`0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';

// Build character spans
const lines = targetText.split('\n');
const allSpans = [];

lines.forEach((line, lineIdx) => {
  const lineDiv = document.createElement('div');
  for (let i = 0; i < line.length; i++) {
    if (line[i] === ' ') {
      lineDiv.appendChild(document.createTextNode(' '));
      allSpans.push(null);
    } else {
      const span = document.createElement('span');
      span.className = 'char';
      span.textContent = line[i];
      span.dataset.original = line[i];
      lineDiv.appendChild(span);
      allSpans.push(span);
    }
  }
  container.appendChild(lineDiv);
});

// Random corruption loop
function corruptLoop() {
  const validSpans = allSpans.filter(Boolean);
  
  // Randomly corrupt 2-5 characters
  const numCorrupt = 2 + Math.floor(Math.random() * 4);
  const indices = [];
  for (let i = 0; i < numCorrupt; i++) {
    indices.push(Math.floor(Math.random() * validSpans.length));
  }

  indices.forEach(idx => {
    const span = validSpans[idx];
    span.classList.add('corrupt');
    span.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];

    // Restore after random time
    setTimeout(() => {
      span.classList.remove('corrupt');
      span.textContent = span.dataset.original;
    }, 100 + Math.random() * 300);
  });

  setTimeout(corruptLoop, 200 + Math.random() * 800);
}

// Start corruption when section is visible
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      corruptLoop();
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.3 });

observer.observe(container.closest('.section'));
</script>
</body>
</html>
