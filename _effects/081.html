<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>颜色反转</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#111;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{width:100%;height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}


  /* 1. Border Gradient Hover */
  .border-grad { width: 200px; height: 60px; position: relative; display: flex; align-items: center; justify-content: center;  border-radius: 12px; cursor: pointer; overflow: hidden; z-index: 0; }
  .border-grad::before { content: ''; position: absolute; inset: -2px; background: conic-gradient(#667eea, #f093fb, #f5576c, #43e97b, #667eea); border-radius: 14px; z-index: -2; opacity: 0; transition: opacity .4s; animation: borderSpin 3s linear infinite; }
  .border-grad::after { content: ''; position: absolute; inset: 2px;  border-radius: 10px; z-index: -1; }
  .border-grad:hover::before { opacity: 1; }
  .border-grad span { color: #ccc; font-weight: 600; transition: color .3s; position: relative; z-index: 1; }
  .border-grad:hover span { color: #fff; }
  @keyframes borderSpin { to { transform: rotate(360deg); } }

  /* 2. Magnetic Button */
  .magnetic-btn { padding: 16px 48px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 50px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; position: relative; overflow: hidden; }
  .magnetic-btn:hover { box-shadow: 0 10px 40px rgba(102,126,234,.4); }
  .magnetic-btn::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,.25), transparent 60%); opacity: 0; transition: opacity .3s; }
  .magnetic-btn:hover::after { opacity: 1; }

  /* 3. Reveal Underline */
  .reveal-line { font-size: 1.6rem; font-weight: 700; color: #fff; position: relative; cursor: pointer; padding-bottom: 6px; }
  .reveal-line::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 3px; background: linear-gradient(90deg, #667eea, #f093fb); transition: width .4s ease; border-radius: 3px; }
  .reveal-line:hover::after { width: 100%; }

  /* 4. Card Tilt */
  .tilt-card { width: 200px; height: 140px; background: linear-gradient(145deg, #1a1a2e, #16213e); border-radius: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .5s ease, box-shadow .5s ease; position: relative; overflow: hidden; border: 1px solid #ffffff10; }
  .tilt-card:hover { transform: perspective(600px) rotateX(5deg) rotateY(-5deg) scale(1.05); box-shadow: 10px 10px 30px rgba(0,0,0,.4), -5px -5px 20px rgba(102,126,234,.1); }
  .tilt-card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 30%, rgba(102,126,234,.15), transparent 60%); opacity: 0; transition: opacity .5s; }
  .tilt-card:hover::before { opacity: 1; }
  .tilt-card span { color: #aaa; font-weight: 600; font-size: .9rem; }

  /* 5. Glowing Icon */
  .glow-icon { width: 70px; height: 70px; border-radius: 50%;  display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer; transition: all .3s ease; border: 1px solid #ffffff10; }
  .glow-icon:hover { background: #667eea; box-shadow: 0 0 20px #667eea88, 0 0 60px #667eea44; transform: scale(1.1); }

  /* 6. Slide Fill Button */
  .slide-fill { position: relative; padding: 14px 42px; border: 2px solid #f5576c; background: transparent; color: #f5576c; font-size: 1rem; font-weight: 600; cursor: pointer; overflow: hidden; border-radius: 8px; transition: color .4s; z-index: 0; font-family: inherit; }
  .slide-fill::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: #f5576c; transition: left .4s ease; z-index: -1; }
  .slide-fill:hover { color: #fff; }
  .slide-fill:hover::before { left: 0; }

  /* 7. Image Zoom + Overlay */
  .img-zoom { width: 200px; height: 140px; border-radius: 12px; overflow: hidden; cursor: pointer; position: relative; }
  .img-zoom-bg { width: 100%; height: 100%; background: linear-gradient(135deg, #1a1a2e, #2d1b69, #764ba2); transition: transform .6s ease; }
  .img-zoom:hover .img-zoom-bg { transform: scale(1.2); }
  .img-zoom-overlay { position: absolute; inset: 0;  display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .4s; }
  .img-zoom:hover .img-zoom-overlay { opacity: 1; }
  .img-zoom-overlay span { color: #fff; font-weight: 600; transform: translateY(10px); transition: transform .4s; }
  .img-zoom:hover .img-zoom-overlay span { transform: translateY(0); }

  /* 8. Ripple Click */
  .ripple-btn { position: relative; padding: 14px 42px; background: linear-gradient(135deg, #43e97b, #38f9d7); border: none; border-radius: 50px; color: #000; font-weight: 700; font-size: 1rem; cursor: pointer; overflow: hidden; font-family: inherit; }
  .ripple-btn .rp { position: absolute; border-radius: 50%; background: rgba(255,255,255,.5); transform: scale(0); animation: rippleClick .6s linear; pointer-events: none; }
  @keyframes rippleClick { to { transform: scale(4); opacity: 0; } }

  /* 9. Stagger List */
  .stagger-list { display: flex; flex-direction: column; gap: 8px; width: 200px; }
  .stagger-item { padding: 10px 16px;  border-radius: 8px; color: #aaa; font-size: .85rem; transform: translateX(-20px); opacity: 0; transition: all .4s ease; cursor: pointer; border-left: 3px solid transparent; }
  .stagger-list:hover .stagger-item { transform: translateX(0); opacity: 1; }
  .stagger-list:hover .stagger-item:nth-child(1) { transition-delay: 0s; }
  .stagger-list:hover .stagger-item:nth-child(2) { transition-delay: .08s; }
  .stagger-list:hover .stagger-item:nth-child(3) { transition-delay: .16s; }
  .stagger-list:hover .stagger-item:nth-child(4) { transition-delay: .24s; }
  .stagger-item:hover { border-left-color: #667eea; color: #fff;  }

  /* 10. Morphing Shape */
  .morph-shape { width: 100px; height: 100px; background: linear-gradient(135deg, #fa709a, #fee140); border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transition: border-radius .8s ease, transform .8s ease, background .8s ease; cursor: pointer; }
  .morph-shape:hover { border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%; transform: rotate(45deg) scale(1.1); background: linear-gradient(135deg, #667eea, #764ba2); }

  /* === NEW EFFECTS === */

  /* 11. Curtain Reveal */
  .curtain { width: 200px; height: 120px; position: relative; cursor: pointer; overflow: hidden; border-radius: 12px; }
  .curtain-bg { width: 100%; height: 100%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; }
  .curtain::before, .curtain::after { content: ''; position: absolute; top: 0; width: 50%; height: 100%;  transition: transform .5s ease; z-index: 1; }
  .curtain::before { left: 0; transform-origin: left; }
  .curtain::after { right: 0; transform-origin: right; }
  .curtain:hover::before { transform: scaleX(0); }
  .curtain:hover::after { transform: scaleX(0); }

  /* 12. Neon Border */
  .neon-border { width: 180px; height: 60px; border: 2px solid #333; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .3s ease; color: #888; font-weight: 600; }
  .neon-border:hover { border-color: #0ff; color: #0ff; box-shadow: 0 0 10px #0ff, inset 0 0 10px rgba(0,255,255,.05); text-shadow: 0 0 10px #0ff; }

  /* 13. Flip Reveal */
  .flip-reveal { width: 180px; height: 120px; perspective: 600px; cursor: pointer; }
  .flip-reveal-inner { width: 100%; height: 100%; transition: transform .6s; transform-style: preserve-3d; position: relative; }
  .flip-reveal:hover .flip-reveal-inner { transform: rotateY(180deg); }
  .flip-reveal-front, .flip-reveal-back { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .flip-reveal-front {  color: #aaa; border: 1px solid #ffffff10; }
  .flip-reveal-back { background: linear-gradient(135deg, #43e97b, #38f9d7); color: #000; transform: rotateY(180deg); }

  /* 14. Scale Up Card */
  .scale-up { width: 180px; height: 120px;  border-radius: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .4s cubic-bezier(.175,.885,.32,1.275); border: 1px solid #ffffff10; color: #888; font-weight: 600; }
  .scale-up:hover { transform: scale(1.08); background: linear-gradient(135deg, #667eea22, #764ba222); border-color: #667eea44; color: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.3); }

  /* 15. Diagonal Swipe */
  .diag-swipe { position: relative; padding: 14px 40px; background: transparent; border: 2px solid #43e97b; color: #43e97b; font-weight: 600; cursor: pointer; overflow: hidden; border-radius: 8px; transition: color .4s; z-index: 0; font-family: inherit; font-size: 1rem; }
  .diag-swipe::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: #43e97b; transform: rotate(-45deg) translateY(-100%); transition: transform .5s ease; z-index: -1; }
  .diag-swipe:hover { color: #000; }
  .diag-swipe:hover::before { transform: rotate(-45deg) translateY(0); }

  /* 16. Icon Rotate */
  .icon-rotate { width: 60px; height: 60px; border-radius: 12px;  display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; transition: all .5s ease; border: 1px solid #ffffff10; }
  .icon-rotate:hover { transform: rotate(360deg); background: #f093fb; box-shadow: 0 0 20px rgba(240,147,251,.3); }

  /* 17. Text Slide Replace */
  .text-slide { position: relative; overflow: hidden; height: 2rem; width: 160px; cursor: pointer; }
  .text-slide span { display: block; transition: transform .3s ease; font-weight: 600; text-align: center; line-height: 2rem; }
  .text-slide span:nth-child(2) { color: #43e97b; }
  .text-slide:hover span { transform: translateY(-100%); }

  /* 18. Shadow Lift */
  .shadow-lift { width: 180px; height: 60px;  border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .4s ease; color: #aaa; font-weight: 600; border: 1px solid #ffffff08; }
  .shadow-lift:hover { transform: translateY(-6px); box-shadow: 0 14px 40px rgba(102,126,234,.2); border-color: #667eea33; color: #fff; }

  /* 19. Border Draw */
  .border-draw { width: 180px; height: 60px; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #aaa; font-weight: 600; transition: color .4s; }
  .border-draw::before, .border-draw::after { content: ''; position: absolute; width: 0; height: 0; border: 2px solid transparent; transition: all .35s ease; }
  .border-draw::before { top: 0; left: 0; border-top-color: #f093fb; border-right-color: #f093fb; }
  .border-draw::after { bottom: 0; right: 0; border-bottom-color: #f093fb; border-left-color: #f093fb; }
  .border-draw:hover::before, .border-draw:hover::after { width: 100%; height: 100%; }
  .border-draw:hover { color: #fff; }

  /* 20. Skew Hover */
  .skew-box { width: 160px; height: 50px; background: linear-gradient(135deg, #764ba2, #667eea); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .3s ease; color: #fff; font-weight: 600; font-size: .9rem; }
  .skew-box:hover { transform: skewX(-5deg) scale(1.05); }

  /* 21. Color Invert */
  .color-invert { padding: 12px 36px; background: #fff; color: #000; border: 2px solid #fff; border-radius: 8px; cursor: pointer; transition: all .3s ease; font-weight: 600; font-size: .9rem; font-family: inherit; }
  .color-invert:hover { background: transparent; color: #fff; }

  /* 22. Spotlight Follow */
  .spotlight { width: 200px; height: 120px;  border-radius: 16px; position: relative; overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .spotlight::before { content: ''; position: absolute; width: 150px; height: 150px; background: radial-gradient(circle, rgba(102,126,234,.3), transparent 70%); top: var(--sy, 50%); left: var(--sx, 50%); transform: translate(-50%,-50%); transition: top .1s, left .1s; pointer-events: none; }
  .spotlight span { color: #aaa; font-weight: 600; position: relative; z-index: 1; transition: color .3s; }
  .spotlight:hover span { color: #fff; }

  /* 23. Pulse Ring Hover */
  .pulse-hover { width: 60px; height: 60px; border-radius: 50%; background: #f5576c; cursor: pointer; position: relative; transition: transform .3s; }
  .pulse-hover::before { content: ''; position: absolute; inset: -8px; border: 2px solid #f5576c; border-radius: 50%; opacity: 0; transition: all .4s; }
  .pulse-hover:hover { transform: scale(1.1); }
  .pulse-hover:hover::before { inset: -16px; opacity: 1; }

  /* 24. Background Slide */
  .bg-slide { padding: 14px 36px; background: linear-gradient(90deg, #667eea 50%, transparent 50%); background-size: 200% 100%; background-position: right; border: 2px solid #667eea; border-radius: 8px; color: #667eea; font-weight: 600; cursor: pointer; transition: all .4s ease; font-family: inherit; font-size: .95rem; }
  .bg-slide:hover { background-position: left; color: #fff; }

  /* 25. Shake on Hover */
  .shake-hover { padding: 12px 32px; background: #ff6b6b; border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; font-family: inherit; font-size: .95rem; transition: transform .1s; }
  .shake-hover:hover { animation: shakeH .4s ease; }
  @keyframes shakeH { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

</style>
</head>
<body>
<div class="stage"><button class="color-invert">Invert</button></div>

</body>
</html>
