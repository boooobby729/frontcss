<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>75 - Squeezy Carousel 挤压轮播</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 48px 48px 0;
  }

  header h1 {
    font-size: 13px;
    font-weight: 500;
    color: #666;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  header p {
    font-size: 13px;
    color: #444;
  }

  .demos {
    display: flex;
    flex-direction: column;
    gap: 80px;
    padding: 48px 0 80px;
  }

  .demo-section {
    padding: 0 48px;
  }

  .demo-label {
    font-size: 11px;
    color: #444;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  /* ── Squeezy Carousel ── */
  .squeezy {
    position: relative;
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    background: #111;
  }

  .squeezy canvas {
    display: block;
    width: 100%;
    cursor: pointer;
  }

  /* 底部信息区 */
  .squeezy-info {
    position: relative;
    height: 120px;
    overflow: hidden;
    background: #0a0a0a;
    border-top: 1px solid #1a1a1a;
  }

  .squeezy-info-slide {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .squeezy-info-slide.active {
    transform: translateX(0);
    opacity: 1;
  }

  .squeezy-info-slide.prev {
    transform: translateX(-60px);
    opacity: 0;
    pointer-events: none;
  }

  .squeezy-info-slide.next {
    transform: translateX(60px);
    opacity: 0;
    pointer-events: none;
  }

  .squeezy-info-text h3 {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .squeezy-info-text p {
    font-size: 13px;
    color: #666;
    line-height: 1.5;
  }

  .squeezy-btn {
    flex-shrink: 0;
    margin-left: 32px;
    padding: 10px 20px;
    border-radius: 20px;
    border: 1px solid #333;
    background: transparent;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.2s, background 0.2s;
  }

  .squeezy-btn:hover {
    border-color: #666;
    background: #1a1a1a;
  }

  /* 指示点 */
  .squeezy-dots {
    display: flex;
    gap: 6px;
    padding: 12px 32px;
    background: #0a0a0a;
  }

  .squeezy-dot {
    width: 6px;
    height: 6px;
    border-radius: 3px;
    background: #333;
    cursor: pointer;
    transition: width 0.3s ease, background 0.3s ease;
  }

  .squeezy-dot.active {
    width: 20px;
    background: #fff;
  }
</style>
</head>
<body>

<header>
  <h1>75 · Squeezy Carousel</h1>
  <p>挤压轮播 — 灵感来自 stripe.com，点击右侧卡片切换</p>
</header>

<div class="demos">

  <!-- Demo 1: 渐变卡片版 -->
  <div class="demo-section">
    <div class="demo-label">渐变卡片版</div>
    <div class="squeezy" id="squeezy1">
      <canvas id="canvas1"></canvas>
      <div class="squeezy-info" id="info1"></div>
      <div class="squeezy-dots" id="dots1"></div>
    </div>
  </div>

  <!-- Demo 2: 深色极简版 -->
  <div class="demo-section">
    <div class="demo-label">深色极简版</div>
    <div class="squeezy" id="squeezy2">
      <canvas id="canvas2"></canvas>
      <div class="squeezy-info" id="info2"></div>
      <div class="squeezy-dots" id="dots2"></div>
    </div>
  </div>

</div>

<script>
// ── 工具函数 ──────────────────────────────────
function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

// ── SqueezyCarousel 类 ────────────────────────
class SqueezyCarousel {
  constructor(canvasEl, infoEl, dotsEl, cards) {
    this.canvas = canvasEl;
    this.ctx = canvasEl.getContext('2d');
    this.infoEl = infoEl;
    this.dotsEl = dotsEl;
    this.cards = cards;
    this.active = 0;
    this.prev = -1;

    // 每张卡片的当前宽度比例（0~1）
    // 主卡片 55%，其余平均分剩余 45%
    const n = cards.length;
    const mainW = 0.55;
    const sliceW = (1 - mainW) / (n - 1);
    this.widths = cards.map((_, i) => i === 0 ? mainW : sliceW);
    this.targetWidths = [...this.widths];

    // 鼠标状态
    this.hoverIndex = -1;
    this.animating = false;

    // 离屏 canvas 缓存（每张卡片的渐变/图案）
    this.offscreens = cards.map(card => this._makeOffscreen(card));

    this._setupDOM();
    this._setupEvents();
    this._resize();
    this._loop();
  }

  _makeOffscreen(card) {
    const oc = document.createElement('canvas');
    oc.width = 800;
    oc.height = 460;
    const ctx = oc.getContext('2d');

    if (card.gradient) {
      const grd = ctx.createLinearGradient(
        card.gradient[0] * 800, card.gradient[1] * 460,
        card.gradient[2] * 800, card.gradient[3] * 460
      );
      card.colors.forEach(([stop, color]) => grd.addColorStop(stop, color));
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, 800, 460);

      // 叠加噪点纹理感
      if (card.lines) {
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 30; i++) {
          const y = (i / 30) * 460 + Math.sin(i * 0.4) * 20;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.bezierCurveTo(200, y - 40, 600, y + 40, 800, y);
          ctx.stroke();
        }
      }

      // 叠加底部渐变遮罩
      const fade = ctx.createLinearGradient(0, 260, 0, 460);
      fade.addColorStop(0, 'rgba(0,0,0,0)');
      fade.addColorStop(1, 'rgba(0,0,0,0.5)');
      ctx.fillStyle = fade;
      ctx.fillRect(0, 0, 800, 460);
    } else if (card.solid) {
      ctx.fillStyle = card.solid;
      ctx.fillRect(0, 0, 800, 460);

      // 细网格纹理
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 0.5;
      for (let x = 0; x < 800; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 460); ctx.stroke();
      }
      for (let y = 0; y < 460; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(800, y); ctx.stroke();
      }

      // 中心光晕
      if (card.glow) {
        const g = ctx.createRadialGradient(400, 230, 0, 400, 230, 350);
        g.addColorStop(0, card.glow + '44');
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 800, 460);
      }
    }

    // 标题文字
    if (card.tag) {
      ctx.font = '700 28px -apple-system, sans-serif';
      ctx.fillStyle = card.tagColor || 'rgba(255,255,255,0.9)';
      ctx.fillText(card.tag, 36, 60);
    }

    // 副标题
    if (card.sub) {
      ctx.font = '400 14px -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText(card.sub, 36, 90);
    }

    // 底部数字
    if (card.stat) {
      ctx.font = '700 48px -apple-system, sans-serif';
      ctx.fillStyle = card.statColor || 'rgba(255,255,255,0.9)';
      ctx.fillText(card.stat, 36, 400);
      ctx.font = '400 13px -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillText(card.statLabel || '', 36, 425);
    }

    return oc;
  }

  _setupDOM() {
    // 信息区 slides
    this.cards.forEach((card, i) => {
      const slide = document.createElement('div');
      slide.className = 'squeezy-info-slide' + (i === 0 ? ' active' : ' next');
      slide.innerHTML = `
        <div class="squeezy-info-text">
          <h3>${card.title}</h3>
          <p>${card.desc}</p>
        </div>
        <button class="squeezy-btn">${card.cta}</button>
      `;
      this.infoEl.appendChild(slide);
    });
    this.slides = this.infoEl.querySelectorAll('.squeezy-info-slide');

    // 指示点
    this.cards.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'squeezy-dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', () => this._activate(i));
      this.dotsEl.appendChild(dot);
    });
    this.dotEls = this.dotsEl.querySelectorAll('.squeezy-dot');
  }

  _setupEvents() {
    this.canvas.addEventListener('mousemove', e => {
      const rect = this.canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) / rect.width;
      let x = 0;
      let found = -1;
      for (let i = 0; i < this.widths.length; i++) {
        if (mx >= x && mx < x + this.widths[i]) { found = i; break; }
        x += this.widths[i];
      }
      this.hoverIndex = found;
      this.canvas.style.cursor = (found !== -1 && found !== this.active) ? 'pointer' : 'default';
    });

    this.canvas.addEventListener('mouseleave', () => {
      this.hoverIndex = -1;
      this.canvas.style.cursor = 'default';
    });

    this.canvas.addEventListener('click', e => {
      const rect = this.canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) / rect.width;
      let x = 0;
      for (let i = 0; i < this.widths.length; i++) {
        if (mx >= x && mx < x + this.widths[i]) {
          if (i !== this.active) this._activate(i);
          break;
        }
        x += this.widths[i];
      }
    });
  }

  _resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = this.canvas.parentElement.clientWidth;
    const h = Math.round(w * 0.42);
    this.canvas.width = w * dpr;
    this.canvas.height = h * dpr;
    this.canvas.style.height = h + 'px';
    this.ctx.scale(dpr, dpr);
    this.W = w;
    this.H = h;
  }

  _activate(idx) {
    if (idx === this.active || this.animating) return;
    this.prev = this.active;
    this.active = idx;
    this.animating = true;

    // 更新目标宽度
    const n = this.cards.length;
    const mainW = 0.55;
    const sliceW = (1 - mainW) / (n - 1);
    this.targetWidths = this.cards.map((_, i) => i === idx ? mainW : sliceW);

    // 更新信息区
    this.slides.forEach((slide, i) => {
      if (i === idx) {
        slide.className = 'squeezy-info-slide active';
      } else if (i === this.prev) {
        slide.className = 'squeezy-info-slide prev';
      } else {
        slide.className = 'squeezy-info-slide next';
      }
    });

    // 更新指示点
    this.dotEls.forEach((dot, i) => {
      dot.classList.toggle('active', i === idx);
    });

    // 动画结束
    setTimeout(() => { this.animating = false; }, 700);
  }

  _draw() {
    const ctx = this.ctx;
    const W = this.W, H = this.H;
    ctx.clearRect(0, 0, W, H);

    let x = 0;
    for (let i = 0; i < this.cards.length; i++) {
      const w = this.widths[i] * W;
      const oc = this.offscreens[i];
      const isActive = i === this.active;
      const isHover = i === this.hoverIndex && !isActive;

      // 裁切并绘制卡片内容
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, 0, w, H);
      ctx.clip();

      // 绘制背景图（始终从 offscreen 左上角读取整张，缩放填充当前切片区域）
      ctx.drawImage(oc, 0, 0, oc.width, oc.height, x, 0, w, H);

      // hover 高亮蒙版
      if (isHover) {
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(x, 0, w, H);
      }

      // 切片分隔线
      if (i > 0 && w > 2) {
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(x, 0, 1.5, H);
      }

      // 非激活卡片：暗化遮罩（越窄越暗）
      if (!isActive) {
        const darkness = Math.max(0, 0.5 - this.widths[i] * 2);
        if (darkness > 0) {
          ctx.fillStyle = `rgba(0,0,0,${darkness})`;
          ctx.fillRect(x, 0, w, H);
        }
      }

      ctx.restore();
      x += w;
    }
  }

  _loop() {
    const SPEED = 0.1;
    // 插值宽度
    let changed = false;
    for (let i = 0; i < this.widths.length; i++) {
      const diff = this.targetWidths[i] - this.widths[i];
      if (Math.abs(diff) > 0.0001) {
        this.widths[i] = lerp(this.widths[i], this.targetWidths[i], SPEED);
        changed = true;
      } else {
        this.widths[i] = this.targetWidths[i];
      }
    }

    // 归一化（防止累计误差）
    const sum = this.widths.reduce((a, b) => a + b, 0);
    if (Math.abs(sum - 1) > 0.001) {
      const scale = 1 / sum;
      for (let i = 0; i < this.widths.length; i++) this.widths[i] *= scale;
    }

    this._draw();
    requestAnimationFrame(() => this._loop());
  }
}
