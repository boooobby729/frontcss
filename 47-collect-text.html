<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collect 文本变化</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  body{
    background:#000;
    color:#e0e0e0;
    font-family:'Inter','SF Pro Display',-apple-system,sans-serif;
    overflow-x:hidden;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .back{
    position:fixed;top:20px;left:20px;
    color:rgba(255,255,255,.4);text-decoration:none;font-size:.85rem;
    z-index:999;background:rgba(255,255,255,.06);
    padding:6px 14px;border-radius:8px;
    backdrop-filter:blur(10px);
    transition:color .2s;
  }
  .back:hover{color:#fff}

  /* ===== Hero 区域 ===== */
  .hero{
    text-align:center;
    padding:0 40px;
    position:relative;
  }

  .hero-line{
    font-size:clamp(2.5rem,7vw,5.5rem);
    font-weight:300;
    color:rgba(255,255,255,.85);
    letter-spacing:-.04em;
    line-height:1.15;
  }

  /* ===== 可变字体波浪动画（Dia 风格） ===== */
  .wave-word{
    display:inline-flex;
    font-weight:800;
    color:#fff;
  }
  .wave-word .letter{
    display:inline-block;
    white-space:pre;
    transition:font-weight .4s cubic-bezier(.22,1,.36,1);
    will-change:font-weight;
  }

  /* ===== 文字轮播区域 ===== */
  .swap-container{
    display:inline-block;
    position:relative;
    height:1.2em;
    overflow:hidden;
    vertical-align:bottom;
  }

  .swap-track{
    position:relative;
    transition:transform .7s cubic-bezier(.22,1,.36,1);
  }

  .swap-word{
    display:block;
    height:1.2em;
    line-height:1.2em;
    font-weight:800;
    background:linear-gradient(135deg,#FFACE3,#FFF1AC,#79C9FF,#4A60D1);
    background-size:300% 300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    animation:gradientShift 6s ease infinite;
    white-space:nowrap;
  }

  @keyframes gradientShift{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  /* ===== 副标题 ===== */
  .subtitle{
    margin-top:24px;
    font-size:clamp(.9rem,1.8vw,1.2rem);
    color:rgba(255,255,255,.3);
    font-weight:400;
    max-width:500px;
    line-height:1.6;
  }

  /* ===== 分隔线 ===== */
  .divider{
    width:60px;height:1px;
    background:rgba(255,255,255,.1);
    margin:48px auto;
  }

  /* ===== 效果展示区 ===== */
  .demos{
    display:flex;
    flex-direction:column;
    gap:64px;
    padding:0 40px 80px;
    max-width:800px;
    width:100%;
  }

  .demo-section{
    text-align:center;
  }

  .demo-label{
    font-size:.7rem;
    text-transform:uppercase;
    letter-spacing:.15em;
    color:rgba(255,255,255,.25);
    margin-bottom:20px;
  }

  /* === 效果1：逐字揭示 === */
  .reveal-text{
    font-size:clamp(1.8rem,4vw,3rem);
    font-weight:700;
    color:#fff;
    letter-spacing:-.03em;
    line-height:1.3;
  }
  .reveal-text .char{
    display:inline-block;
    opacity:0;
    transform:translateY(20px);
    filter:blur(8px);
    transition:all .5s cubic-bezier(.22,1,.36,1);
  }
  .reveal-text .char.visible{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }
  .reveal-text .space{
    display:inline-block;
    width:.3em;
  }

  /* === 效果2：字重波浪 === */
  .weight-wave{
    font-size:clamp(2rem,5vw,3.5rem);
    color:#fff;
    letter-spacing:-.03em;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:0;
  }
  .weight-wave .wl{
    display:inline-block;
    white-space:pre;
    font-weight:100;
    transition:font-weight .35s cubic-bezier(.22,1,.36,1),
               color .35s ease;
    will-change:font-weight;
  }

  /* === 效果3：模糊切换 === */
  .blur-swap{
    font-size:clamp(2rem,5vw,3.5rem);
    font-weight:700;
    color:#fff;
    letter-spacing:-.03em;
    position:relative;
    height:1.3em;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .blur-swap .bs-word{
    position:absolute;
    transition:all .6s cubic-bezier(.22,1,.36,1);
    white-space:nowrap;
  }
  .blur-swap .bs-word.active{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
  }
  .blur-swap .bs-word.above{
    opacity:0;
    transform:translateY(-60px) scale(.95);
    filter:blur(12px);
  }
  .blur-swap .bs-word.below{
    opacity:0;
    transform:translateY(60px) scale(.95);
    filter:blur(12px);
  }

  /* === 效果4：打字机 + 光标 === */
  .typewriter{
    font-size:clamp(1.5rem,3.5vw,2.5rem);
    font-weight:600;
    color:#fff;
    letter-spacing:-.02em;
    display:inline;
  }
  .typewriter .cursor{
    display:inline-block;
    width:2px;
    height:1em;
    background:#FFACE3;
    margin-left:2px;
    vertical-align:text-bottom;
    animation:blink .6s step-end infinite;
  }
  @keyframes blink{
    0%,100%{opacity:1}
    50%{opacity:0}
  }
</style>
</head>
<body>
<a href="index.html" class="back">&larr; 返回资源库</a>

<!-- Hero -->
<div class="hero">
  <div class="hero-line">
    A browser that
  </div>
  <div class="hero-line">
    <span class="wave-word" id="waveWord">works</span>
  </div>
  <div class="hero-line">
    <span class="swap-container" id="swapContainer">
      <span class="swap-track" id="swapTrack">
        <span class="swap-word">with you</span>
        <span class="swap-word">for you</span>
        <span class="swap-word">beside you</span>
        <span class="swap-word">around you</span>
      </span>
    </span>
  </div>
  <p class="subtitle">
    Dia 风格文本动画效果集。可变字体波浪、<br>
    文字轮播切换、逐字揭示、模糊过渡。
  </p>
</div>

<div class="divider"></div>

<!-- 效果展示 -->
<div class="demos">

  <!-- 效果1：逐字揭示 -->
  <div class="demo-section">
    <div class="demo-label">逐字揭示 · Blur Reveal</div>
    <div class="reveal-text" id="revealText"></div>
  </div>

  <!-- 效果2：字重波浪 -->
  <div class="demo-section">
    <div class="demo-label">字重波浪 · Weight Wave</div>
    <div class="weight-wave" id="weightWave"></div>
  </div>

  <!-- 效果3：模糊切换 -->
  <div class="demo-section">
    <div class="demo-label">模糊切换 · Blur Swap</div>
    <div class="blur-swap" id="blurSwap"></div>
  </div>

  <!-- 效果4：打字机 -->
  <div class="demo-section">
    <div class="demo-label">打字机 · Typewriter</div>
    <div style="display:flex;justify-content:center">
      <span class="typewriter" id="typewriter"></span><span class="typewriter"><span class="cursor"></span></span>
    </div>
  </div>

</div>

<script>
(function(){

  /* ========== Dia 颜色 ========== */
  const DIA_COLORS = ['#FFACE3','#FFF1AC','#79C9FF','#4A60D1','#5092C7','#3C6AFF'];

  /* ========== 1. Hero 字重波浪（Dia 风格） ========== */
  const waveWord = document.getElementById('waveWord');
  const waveLetters = [];
  const text = waveWord.textContent.trim();
  waveWord.textContent = '';
  for(let i = 0; i < text.length; i++){
    const span = document.createElement('span');
    span.className = 'letter';
    span.textContent = text[i];
    waveWord.appendChild(span);
    waveLetters.push(span);
  }

  let wavePhase = 0;
  function animateWave(){
    wavePhase += 0.06;
    for(let i = 0; i < waveLetters.length; i++){
      // 正弦波控制字重 100-900
      const val = Math.sin(wavePhase + i * 0.8);
      const weight = Math.round(500 + val * 400);
      waveLetters[i].style.fontWeight = weight;
    }
    requestAnimationFrame(animateWave);
  }
  animateWave();

  /* ========== 2. Hero 文字轮播 ========== */
  const swapTrack = document.getElementById('swapTrack');
  const swapWords = swapTrack.querySelectorAll('.swap-word');
  let swapIndex = 0;

  setInterval(()=>{
    swapIndex = (swapIndex + 1) % swapWords.length;
    swapTrack.style.transform = `translateY(-${swapIndex * 1.2}em)`;
  }, 2500);

  /* ========== 3. 逐字揭示 ========== */
  const revealEl = document.getElementById('revealText');
  const revealPhrases = [
    'Build something extraordinary.',
    'Design with intention.',
    'Create without limits.',
    'Think beyond boundaries.'
  ];
  let revealIdx = 0;

  function doReveal(){
    const phrase = revealPhrases[revealIdx];
    revealEl.innerHTML = '';
    const chars = [];
    for(let i = 0; i < phrase.length; i++){
      if(phrase[i] === ' '){
        const sp = document.createElement('span');
        sp.className = 'space';
        revealEl.appendChild(sp);
      } else {
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = phrase[i];
        revealEl.appendChild(span);
        chars.push(span);
      }
    }
    // 逐字显示
    chars.forEach((c, i) => {
      setTimeout(()=> c.classList.add('visible'), 40 * i);
    });
    // 逐字隐藏
    const totalShow = 40 * chars.length + 1500;
    chars.forEach((c, i) => {
      setTimeout(()=> c.classList.remove('visible'), totalShow + 30 * i);
    });
    // 下一轮
    const totalTime = totalShow + 30 * chars.length + 600;
    setTimeout(()=>{
      revealIdx = (revealIdx + 1) % revealPhrases.length;
      doReveal();
    }, totalTime);
  }
  doReveal();

  /* ========== 4. 字重波浪（展示区） ========== */
  const weightEl = document.getElementById('weightWave');
  const weightText = 'Variable Font Wave';
  const weightLetters = [];
  for(let i = 0; i < weightText.length; i++){
    const span = document.createElement('span');
    span.className = 'wl';
    span.textContent = weightText[i] === ' ' ? '\u00A0' : weightText[i];
    weightEl.appendChild(span);
    weightLetters.push(span);
  }

  let wPhase = 0;
  function animateWeight(){
    wPhase += 0.04;
    for(let i = 0; i < weightLetters.length; i++){
      const val = Math.sin(wPhase + i * 0.5);
      const weight = Math.round(500 + val * 400);
      weightLetters[i].style.fontWeight = weight;
      // 颜色也跟着变
      const colorIdx = Math.floor(((val + 1) / 2) * (DIA_COLORS.length - 1));
      weightLetters[i].style.color = DIA_COLORS[colorIdx];
    }
    requestAnimationFrame(animateWeight);
  }
  animateWeight();

  /* ========== 5. 模糊切换 ========== */
  const blurEl = document.getElementById('blurSwap');
  const blurWords = ['Innovate','Collaborate','Accelerate','Dominate'];
  let blurIdx = 0;

  // 初始化
  blurWords.forEach((w, i) => {
    const span = document.createElement('span');
    span.className = 'bs-word ' + (i === 0 ? 'active' : 'below');
    span.textContent = w;
    blurEl.appendChild(span);
  });

  const bsEls = blurEl.querySelectorAll('.bs-word');
  setInterval(()=>{
    const prev = blurIdx;
    blurIdx = (blurIdx + 1) % blurWords.length;
    bsEls[prev].className = 'bs-word above';
    bsEls[blurIdx].className = 'bs-word active';
    // 重置其他
    setTimeout(()=>{
      bsEls.forEach((el, i) => {
        if(i !== blurIdx && !el.classList.contains('above')){
          el.className = 'bs-word below';
        }
      });
    }, 100);
    setTimeout(()=>{
      bsEls[prev].className = 'bs-word below';
    }, 700);
  }, 2200);

  /* ========== 6. 打字机 ========== */
  const typeEl = document.getElementById('typewriter');
  const typePhrases = [
    'The future is now.',
    'Less noise, more signal.',
    'Built for deep work.',
    'Your browser, reimagined.'
  ];
  let typeIdx = 0;
  let typeCharIdx = 0;
  let typeDeleting = false;

  function typeStep(){
    const phrase = typePhrases[typeIdx];
    if(!typeDeleting){
      typeCharIdx++;
      typeEl.textContent = phrase.substring(0, typeCharIdx);
      if(typeCharIdx >= phrase.length){
        setTimeout(()=>{ typeDeleting = true; typeStep(); }, 1800);
        return;
      }
      setTimeout(typeStep, 60 + Math.random() * 40);
    } else {
      typeCharIdx--;
      typeEl.textContent = phrase.substring(0, typeCharIdx);
      if(typeCharIdx <= 0){
        typeDeleting = false;
        typeIdx = (typeIdx + 1) % typePhrases.length;
        setTimeout(typeStep, 400);
        return;
      }
      setTimeout(typeStep, 30);
    }
  }
  typeStep();

})();
</script>

</body>
</html>
